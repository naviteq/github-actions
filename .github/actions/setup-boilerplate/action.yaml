---
name: Setup boilerplate
description: >
  Install the gruntwork-io/boilerplate template renderer at an exact version, verified against
  the release asset digest, or keep it when the runner already has that version

inputs:
  version:
    description: Exact boilerplate version to install (e.g. v0.16.0)
    required: false
    default: v0.16.0

outputs:
  version:
    description: Installed boilerplate version string, as `boilerplate --version` prints it
    value: ${{ steps.verify.outputs.version }}

runs:
  using: composite
  steps:
    # → see docs/setup-boilerplate.md
    - name: Ensure boilerplate ${{ inputs.version }}
      uses: naviteq/github-actions/.github/actions/ensure-tool@ab82a7696a6afa493ab548591c642eea7f8b86e8
      with:
        tool: boilerplate
        version: ${{ inputs.version }}

    - name: Verify boilerplate installation
      id: verify
      shell: bash
      run: |
        set -euo pipefail
        echo "version=$(boilerplate --version)" >> "$GITHUB_OUTPUT"
