---
name: Install aws-nuke
description: >-
  Compatibility wrapper over ensure-tool for aws-nuke. Downloads the pinned release of
  ekristen/aws-nuke v3, verifies its SHA-256 against the publisher's checksums.txt and puts it on
  PATH. Linux x64/arm64 only; new callers use ensure-tool.

inputs:
  version:
    description: >-
      aws-nuke release version (e.g. 3.64.4). Must be an exact version, not "latest", so the
      plan-phase resource-set hash is reproducible across runs.
    required: true
  checksum:
    description: >-
      Retired. ensure-tool always verifies against the release checksums.txt and has no override,
      so a non-empty value fails the step instead of being ignored.
    required: false
    default: ""

outputs:
  version:
    description: Installed aws-nuke version string (e.g. 3.64.4)
    value: ${{ steps.ensure.outputs.resolved }}

runs:
  using: composite
  steps:
    - name: Refuse a checksum override
      if: ${{ inputs.checksum != '' }}
      shell: bash
      run: |
        echo "::error title=aws-nuke-install::the checksum input is retired; ensure-tool verifies against the publisher checksums.txt and has no override"
        exit 1

    - name: Ensure aws-nuke
      id: ensure
      uses: naviteq/github-actions/.github/actions/ensure-tool@d46247ca2cbfc4599a70d47d77d83569c24b2f68
      with:
        tool: aws-nuke
        version: ${{ inputs.version }}
