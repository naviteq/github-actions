---
name: Install aws-nuke
description: >-
  Download a pinned release of ekristen/aws-nuke v3 from GitHub, verify its
  SHA-256 checksum against the publisher-signed checksums.txt, and place the
  binary on PATH. Linux x64/arm64 only.

inputs:
  version:
    description: >-
      aws-nuke release version (e.g. 3.64.4). Must match an existing release
      tag of ekristen/aws-nuke. Use a pinned version, not "latest", so the
      plan-phase resource-set hash is reproducible across runs.
    required: true
  checksum:
    description: >-
      Optional override for the expected SHA-256 of the downloaded archive.
      When empty, the checksum is fetched from the release's checksums.txt
      and verified inline. Provide a literal hex digest only to defend
      against a compromised release checksums file.
    required: false
    default: ""

outputs:
  version:
    description: Installed aws-nuke version string (e.g. 3.64.4)
    value: ${{ steps.verify.outputs.version }}

runs:
  using: composite
  steps:
    - name: Download and verify aws-nuke
      shell: bash
      env:
        AWS_NUKE_VERSION: ${{ inputs.version }}
        AWS_NUKE_CHECKSUM_OVERRIDE: ${{ inputs.checksum }}
      run: |
        set -euo pipefail

        echo "::group::Detect runner OS and architecture"
        if [[ "$RUNNER_OS" != "Linux" ]]; then
          echo "aws-nuke install supports Linux runners only (got: $RUNNER_OS)" >&2
          echo "::endgroup::"
          exit 1
        fi

        case "$RUNNER_ARCH" in
          X64)   ARCH="amd64" ;;
          ARM64) ARCH="arm64" ;;
          *)
            echo "Unsupported architecture: $RUNNER_ARCH" >&2
            echo "::endgroup::"
            exit 1
            ;;
        esac

        BASE_URL="https://github.com/ekristen/aws-nuke/releases/download/v${AWS_NUKE_VERSION}"
        ARCHIVE="aws-nuke-v${AWS_NUKE_VERSION}-linux-${ARCH}.tar.gz"
        WORK_DIR="$(mktemp -d)"
        # Combine workdir cleanup with closing whatever group is open on exit.
        trap 'rm -rf "$WORK_DIR"; echo "::endgroup::"' EXIT
        echo "::endgroup::"

        echo "::group::Download aws-nuke archive"
        echo "Downloading ${BASE_URL}/${ARCHIVE}"
        curl -fsSL --retry 3 -o "${WORK_DIR}/${ARCHIVE}" "${BASE_URL}/${ARCHIVE}"
        echo "::endgroup::"

        echo "::group::Resolve expected SHA-256 (override or checksums.txt)"
        if [[ -n "${AWS_NUKE_CHECKSUM_OVERRIDE}" ]]; then
          EXPECTED="${AWS_NUKE_CHECKSUM_OVERRIDE}"
        else
          echo "Fetching checksums.txt"
          curl -fsSL --retry 3 -o "${WORK_DIR}/checksums.txt" "${BASE_URL}/checksums.txt"
          EXPECTED="$(awk -v f="${ARCHIVE}" '$2 == f {print $1}' "${WORK_DIR}/checksums.txt")"
        fi

        if [[ -z "${EXPECTED}" ]]; then
          echo "No SHA-256 found for ${ARCHIVE}" >&2
          exit 1
        fi
        echo "::endgroup::"

        echo "::group::Verify archive checksum"
        ACTUAL="$(sha256sum "${WORK_DIR}/${ARCHIVE}" | awk '{print $1}')"
        if [[ "${EXPECTED}" != "${ACTUAL}" ]]; then
          echo "Checksum mismatch for ${ARCHIVE}" >&2
          echo "  expected: ${EXPECTED}" >&2
          echo "  actual:   ${ACTUAL}" >&2
          exit 1
        fi
        echo "::endgroup::"

        echo "::group::Install aws-nuke binary and update PATH"
        mkdir -p "${HOME}/.local/bin"
        tar -xzf "${WORK_DIR}/${ARCHIVE}" -C "${WORK_DIR}"
        # The archive contains a single `aws-nuke` binary in the root.
        install -m 0755 "${WORK_DIR}/aws-nuke" "${HOME}/.local/bin/aws-nuke"
        echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
        echo "::endgroup::"

    - name: Verify aws-nuke installation
      id: verify
      shell: bash
      env:
        AWS_NUKE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        trap 'echo "::endgroup::"' EXIT
        echo "::group::Verify installed aws-nuke version matches requested"
        aws-nuke version
        installed="$(aws-nuke version 2>&1 | awk '/Version:/ {print $2}' | sed 's/^v//')"
        if [[ -z "${installed}" ]]; then
          installed="${AWS_NUKE_VERSION}"
        fi
        if [[ "${installed}" != "${AWS_NUKE_VERSION}" ]]; then
          echo "Installed aws-nuke version ${installed} does not match requested ${AWS_NUKE_VERSION}" >&2
          exit 1
        fi
        echo "version=${installed}" >> "$GITHUB_OUTPUT"

    - name: Write step summary
      if: ${{ always() }}
      shell: bash
      env:
        AWS_NUKE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        echo "::group::Write aws-nuke install summary"
        {
          echo "## Install aws-nuke"
          echo ""
          echo "| Field | Value |"
          echo "| ----- | ----- |"
          echo "| Requested version | \`${AWS_NUKE_VERSION}\` |"
          echo "| OS | \`${RUNNER_OS}\` |"
          echo "| Architecture | \`${RUNNER_ARCH}\` |"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "::endgroup::"
