---
name: Setup Terragrunt
description: >
  Install Terragrunt and the engine it drives (OpenTofu by default, or Terraform),
  at the versions the checked-out repository pins in .terragrunt-version and
  .opentofu-version / .terraform-version.

inputs:
  engine:
    description: Engine Terragrunt drives, tofu or terraform
    required: false
    default: tofu
  terragrunt_version:
    description: Terragrunt version; read from .terragrunt-version when empty
    required: false
    default: ""
  opentofu_version:
    description: OpenTofu version; read from .opentofu-version when empty. Ignored for engine terraform
    required: false
    default: ""
  terraform_version:
    description: Terraform version; read from .terraform-version when empty. Ignored for engine tofu
    required: false
    default: ""
  working_directory:
    description: Where to look for the version files
    required: false
    default: "."

outputs:
  terragrunt_version:
    description: The Terragrunt version that was installed
    value: ${{ steps.resolve.outputs.terragrunt }}
  opentofu_version:
    description: The OpenTofu version that was installed; empty for engine terraform
    value: ${{ steps.resolve.outputs.opentofu }}
  terraform_version:
    description: The Terraform version that was installed; empty for engine tofu
    value: ${{ steps.resolve.outputs.terraform }}

runs:
  using: composite
  steps:
    - name: Resolve the versions
      id: resolve
      shell: bash
      env:
        ENGINE: ${{ inputs.engine }}
        TERRAGRUNT_INPUT: ${{ inputs.terragrunt_version }}
        OPENTOFU_INPUT: ${{ inputs.opentofu_version }}
        TERRAFORM_INPUT: ${{ inputs.terraform_version }}
        WORKING_DIRECTORY: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail

        resolve() {
          if [ -n "$2" ]; then echo "$2"; return; fi
          if [ -f "${WORKING_DIRECTORY}/$1" ]; then tr -d '[:space:]' < "${WORKING_DIRECTORY}/$1"; return; fi
          echo "::error title=No version pinned::Pass $3, or commit a $1 the way the catalog does."
          exit 1
        }

        terragrunt="$(resolve .terragrunt-version "${TERRAGRUNT_INPUT}" terragrunt_version)"
        opentofu=""
        terraform=""
        case "${ENGINE}" in
          tofu) opentofu="$(resolve .opentofu-version "${OPENTOFU_INPUT}" opentofu_version)" ;;
          terraform) terraform="$(resolve .terraform-version "${TERRAFORM_INPUT}" terraform_version)" ;;
          *) echo "::error title=Unknown engine::engine is '${ENGINE}'; use tofu or terraform."; exit 1 ;;
        esac
        echo "Terragrunt ${terragrunt} driving ${ENGINE} ${opentofu}${terraform}"
        {
          echo "terragrunt=${terragrunt}"
          echo "opentofu=${opentofu}"
          echo "terraform=${terraform}"
        } >> "$GITHUB_OUTPUT"

    - name: Install OpenTofu
      if: inputs.engine == 'tofu'
      uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      with:
        tofu_version: ${{ steps.resolve.outputs.opentofu }}
        tofu_wrapper: false

    - name: Install Terraform
      if: inputs.engine == 'terraform'
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.resolve.outputs.terraform }}
        terraform_wrapper: false

    # A pinned release binary, not an action: every Terragrunt action on the
    # marketplace wraps this same download behind a third party. → AGENTS.md
    - name: Install Terragrunt
      shell: bash
      env:
        TERRAGRUNT_VERSION: ${{ steps.resolve.outputs.terragrunt }}
      run: |
        set -euo pipefail
        case "$RUNNER_ARCH" in
          X64 | X86) arch="amd64" ;;
          ARM64) arch="arm64" ;;
          *) echo "::error title=Unsupported architecture::${RUNNER_ARCH}"; exit 1 ;;
        esac
        os="$(uname -s | tr '[:upper:]' '[:lower:]')"
        sudo curl -fsSL -o /usr/local/bin/terragrunt \
          "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION#v}/terragrunt_${os}_${arch}"
        sudo chmod +x /usr/local/bin/terragrunt

    # A runner image may bake tofu as well; without this Terragrunt picks it first.
    - name: Point Terragrunt at the engine
      shell: bash
      env:
        ENGINE: ${{ inputs.engine }}
      run: echo "TG_TF_PATH=${ENGINE}" >> "$GITHUB_ENV"

    - name: Verify both are callable
      shell: bash
      env:
        ENGINE: ${{ inputs.engine }}
      run: |
        set -euo pipefail
        terragrunt --version
        "${ENGINE}" version
