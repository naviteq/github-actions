---
name: Setup OCI CLI
description: >
  Install the OCI CLI at an exact version, or keep it when the runner already has that version.
  No setup-python: the runner's own python3, through uv when it is there.

inputs:
  version:
    description: >-
      Exact oci-cli version (e.g. 3.94.2). "latest" still works but is resolved to the newest
      PyPI release with a warning, so the run says which version it got.
    required: false
    default: "3.94.2"

outputs:
  version:
    description: Installed oci-cli version string (e.g. 3.94.2)
    value: ${{ steps.verify.outputs.version }}

runs:
  using: composite
  steps:
    # → see docs/setup-oci-cli.md
    - name: Resolve the oci-cli version
      id: resolve
      shell: bash
      env:
        REQUESTED: ${{ inputs.version }}
      run: |
        set -euo pipefail
        version="${REQUESTED// /}"
        if [ "${version,,}" = "latest" ]; then
          version="$(curl -fsSL --retry 5 --retry-all-errors https://pypi.org/pypi/oci-cli/json | jq -r '.info.version')"
          echo "::warning title=setup-oci-cli::version latest resolved to ${version} from PyPI; pin an exact version so the run is reproducible"
        fi
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Ensure oci-cli ${{ steps.resolve.outputs.version }}
      uses: naviteq/github-actions/.github/actions/ensure-tool@efd0c711d87cc906bb5adc9e14ac293d29f83b1a
      with:
        tool: oci-cli
        version: ${{ steps.resolve.outputs.version }}

    - name: Verify oci-cli installation
      id: verify
      shell: bash
      run: |
        set -euo pipefail
        echo "version=$(oci --version)" >> "$GITHUB_OUTPUT"
