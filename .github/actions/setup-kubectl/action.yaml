---
name: Setup kubectl
description: >
  Install kubectl at the version a cluster pins. A major.minor version resolves to that
  minor's latest patch; the binary is checksum-verified and skipped when already on PATH.

inputs:
  version:
    description: >
      Kubernetes version, e.g. v1.36.1, or 1.36 for that minor's latest patch. Empty means
      the pinned fallback v1.36.5, for a caller that has no cluster to ask
    required: false
    default: ""

outputs:
  version:
    description: The version that was installed, with a leading v
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    # → see docs/setup-kubectl.md
    - name: Resolve the kubectl version
      id: resolve
      shell: bash
      env:
        REQUESTED: ${{ inputs.version }}
        FALLBACK_VERSION: v1.36.5
      run: |
        set -euo pipefail
        version="${REQUESTED// /}"
        if [ -z "${version}" ]; then
          version="${FALLBACK_VERSION}"
          echo "::notice title=setup-kubectl::No version given; using the pinned fallback ${version}"
        fi
        case "${version}" in v*) ;; *) version="v${version}" ;; esac
        case "${version}" in
          v[0-9]*.[0-9]*.[0-9]*) ;;
          v[0-9]*.[0-9]*)
            version="$(curl -fsSL --retry 5 --retry-all-errors "https://dl.k8s.io/release/stable-${version#v}.txt")"
            echo "Resolved ${REQUESTED} to ${version}"
            ;;
          *)
            echo "::error title=setup-kubectl::version '${REQUESTED}' is neither X.Y nor X.Y.Z"
            exit 1
            ;;
        esac
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Ensure kubectl ${{ steps.resolve.outputs.version }}
      uses: naviteq/github-actions/.github/actions/ensure-tool@e2338b3a03ecf37048630fc491a5f49114316a15
      with:
        tool: kubectl
        version: ${{ steps.resolve.outputs.version }}
