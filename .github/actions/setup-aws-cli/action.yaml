---
name: Setup AWS CLI v2
description: >
  Compatibility wrapper over ensure-tool for AWS CLI v2. Keeps the baked aws when it already
  reports the requested version, otherwise installs it with a verified PGP signature. Linux only;
  new callers use ensure-tool.

inputs:
  version:
    description: >-
      AWS CLI v2 version to ensure, exact (e.g. 2.37.12). latest is rejected: an unpinned install
      differs between runs.
    required: false
    default: 2.37.12

outputs:
  version:
    description: Installed AWS CLI version string (e.g. 2.37.12)
    value: ${{ steps.verify.outputs.version }}

runs:
  using: composite
  steps:
    - name: Ensure aws
      id: ensure
      uses: naviteq/github-actions/.github/actions/ensure-tool@d66aec7da4ecbd620c13d8c616ac66ea66bbc0f6
      with:
        tool: aws
        version: ${{ inputs.version }}

    - name: Verify AWS CLI installation
      id: verify
      shell: bash
      env:
        RESOLVED: ${{ steps.ensure.outputs.resolved }}
      run: |
        aws --version
        echo "version=${RESOLVED}" >> "$GITHUB_OUTPUT"
