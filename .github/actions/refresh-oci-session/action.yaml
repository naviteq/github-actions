---
name: Refresh OCI session
description: >
  Keep a job's OCI session alive past the session token's one-hour life by renewing the
  token file configure-oci-credentials wrote, with the same ephemeral key. start runs a
  detached renewal loop, once renews now, report prints what both did.
  → see docs/refresh-oci-session.md

inputs:
  mode:
    description: start (a detached loop), once (one renewal now) or report (print the loop's log)
    required: false
    default: start
  oidc_domain_url:
    description: The identity domain URL, as given to configure-oci-credentials; needed by start and once
    required: false
    default: ""
  oidc_client_id:
    description: The Confidential Application's OAuth client ID; needed by start and once
    required: false
    default: ""
  oidc_client_secret:
    description: The Confidential Application's OAuth client secret; needed by start and once
    required: false
    default: ""
  interval_seconds:
    description: Seconds between two renewals of the loop; at least 60
    required: false
    default: "1200"

runs:
  using: composite
  steps:
    - name: Refresh the OCI session token
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        MODE: ${{ inputs.mode }}
        OIDC_DOMAIN_URL: ${{ inputs.oidc_domain_url }}
        OIDC_CLIENT_ID: ${{ inputs.oidc_client_id }}
        OIDC_CLIENT_SECRET: ${{ inputs.oidc_client_secret }}
        INTERVAL_SECONDS: ${{ inputs.interval_seconds }}
      run: python3 "${ACTION_PATH}/refresh_oci_session.py" "${MODE}"
