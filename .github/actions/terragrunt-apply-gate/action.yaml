---
name: Terragrunt apply gate
description: >
  After a merge, find the pull request's saved Terragrunt plans and open the issue that
  gates their apply, or a blocking issue that says why they cannot be applied.

inputs:
  command:
    description: find, decide, or request to open the issue that gates a destroy
    required: true
  sha:
    description: The merged commit
    required: true
  prefix:
    description: For find, the plan artifact name prefix
    required: false
    default: terragrunt-plan
  plan_workflow:
    description: For find, file name of the caller workflow that runs the plan on pull requests
    required: false
    default: terragrunt-plan.yaml
  wait_minutes:
    description: For find, how long to wait for a plan of the merged commit that is still running
    required: false
    default: "30"
  plan_state:
    description: For decide, the plan_state find reported
    required: false
    default: ""
  base_commit:
    description: For decide, the merge's first parent, where the units it deleted still exist
    required: false
    default: ""
  pr:
    description: For decide, the merged pull request; empty for a direct push
    required: false
    default: ""
  pr_url:
    description: For decide, the pull request's URL
    required: false
    default: ""
  head_sha:
    description: For decide, the pull request's last commit
    required: false
    default: ""
  artifact_id:
    description: For decide and request, the plan artifact found
    required: false
    default: ""
  metadata:
    description: For decide and request, path of the artifact's metadata.json; empty when none was found
    required: false
    default: ""
  tree:
    description: For decide, the tree of working_directory in the merged commit
    required: false
    default: ""
  changed:
    description: For decide, true when the merge changed anything under working_directory
    required: false
    default: "true"
  working_directory:
    description: For decide, the directory the units live under
    required: false
    default: "."
  approvers:
    description: For decide and request, comma-separated GitHub logins allowed to approve
    required: false
    default: ""
  label:
    description: For decide and request, the label prefix of gate issues
    required: false
    default: terragrunt-apply

outputs:
  pr:
    description: The merged pull request; empty for a direct push
    value: ${{ steps.gate.outputs.pr }}
  pr_url:
    description: Its URL
    value: ${{ steps.gate.outputs.pr_url }}
  head_sha:
    description: Its last commit
    value: ${{ steps.gate.outputs.head_sha }}
  artifact_id:
    description: Its live plan artifact; empty when none was found
    value: ${{ steps.gate.outputs.artifact_id }}
  run_id:
    description: The run that uploaded that artifact
    value: ${{ steps.gate.outputs.run_id }}
  plan_state:
    description: found, running, failed or missing
    value: ${{ steps.gate.outputs.plan_state }}
  state:
    description: nothing, no-changes, pending or blocked
    value: ${{ steps.gate.outputs.state }}
  issue:
    description: The issue opened, if any
    value: ${{ steps.gate.outputs.issue }}
  deleted:
    description: For decide, a filter per unit the merge deleted, one per line; empty when none, or when the plans belong to another commit
    value: ${{ steps.gate.outputs.deleted }}
  deleted_ref:
    description: For decide, the commit where those units still exist
    value: ${{ steps.gate.outputs.deleted_ref }}

runs:
  using: composite
  steps:
    - name: Run the gate step
      id: gate
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        COMMAND: ${{ inputs.command }}
        SHA: ${{ inputs.sha }}
        PREFIX: ${{ inputs.prefix }}
        PLAN_WORKFLOW: ${{ inputs.plan_workflow }}
        WAIT_MINUTES: ${{ inputs.wait_minutes }}
        PLAN_STATE: ${{ inputs.plan_state }}
        BASE_COMMIT: ${{ inputs.base_commit }}
        PR: ${{ inputs.pr }}
        PR_URL: ${{ inputs.pr_url }}
        HEAD_SHA: ${{ inputs.head_sha }}
        ARTIFACT_ID: ${{ inputs.artifact_id }}
        METADATA: ${{ inputs.metadata }}
        TREE: ${{ inputs.tree }}
        CHANGED: ${{ inputs.changed }}
        WORKING_DIRECTORY: ${{ inputs.working_directory }}
        APPROVERS: ${{ inputs.approvers }}
        LABEL: ${{ inputs.label }}
      run: |
        set -euo pipefail
        script="${ACTION_PATH}/gate.py"
        case "${COMMAND}" in
          find)
            python3 "${script}" find --sha "${SHA}" --prefix "${PREFIX}" --plan-workflow "${PLAN_WORKFLOW}" \
              --wait-seconds "$((WAIT_MINUTES * 60))" ;;
          decide)
            python3 "${script}" decide --sha "${SHA}" --pr "${PR}" --pr-url "${PR_URL}" --head-sha "${HEAD_SHA}" \
              --artifact-id "${ARTIFACT_ID}" --metadata "${METADATA}" --tree "${TREE}" --changed "${CHANGED}" \
              --working-directory "${WORKING_DIRECTORY}" --approvers "${APPROVERS}" --label "${LABEL}" \
              --plan-state "${PLAN_STATE}" --base-commit "${BASE_COMMIT}" ;;
          request)
            python3 "${script}" request --artifact-id "${ARTIFACT_ID}" --metadata "${METADATA}" \
              --approvers "${APPROVERS}" --label "${LABEL}" ;;
          *) echo "::error title=Unknown command::${COMMAND}"; exit 1 ;;
        esac
