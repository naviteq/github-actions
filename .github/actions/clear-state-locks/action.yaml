---
name: Clear state locks
description: >
  Delete the OpenTofu .tflock objects a killed run left behind under the working directory's state
  prefix: on AWS in the regional state bucket and in the global one, on OCI in the connection's state
  bucket through the S3-compatible endpoint (the namespace and the state key come from the run's env).
  Best effort: each removal warns with the key, a refused call warns and the step never fails. Safe only where nothing else can hold a
  lock on that prefix.

inputs:
  working_directory:
    description: Directory holding the stack and its units, relative to the repository root
    required: false
    default: ""
  aws_region:
    description: AWS region of the regional state bucket; the global bucket is always read in us-east-1
    required: false
    default: ""

  cloud:
    description: aws or oci
    required: false
    default: aws

runs:
  using: composite
  steps:
    - name: Delete the stale state locks
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        WORKING_DIRECTORY: ${{ inputs.working_directory }}
        AWS_REGION: ${{ inputs.aws_region }}
        CLOUD: ${{ inputs.cloud }}
      run: python3 "${ACTION_PATH}/clear_state_locks.py"
