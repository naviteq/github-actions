name: Receiver token OCI
description: >
  Store the Runestra Console's health-receiver token in OCI Vault under a flat secret name. Best effort:
  the token is masked first, the secret is created when absent (no Terraform makes it on OCI), updated
  only when the stored string differs (no new secret version when equal) and never written when it is
  not ACTIVE; a refused call warns with metadata-only diagnostics and the step never fails; with the
  token, the secret name or the region empty it does nothing.

inputs:
  token:
    description: Console health-receiver token, 32-128 characters of A-Za-z0-9_-
    required: false
    default: ""
  secret_name:
    description: Flat OCI Vault secret name (A-Za-z0-9._-) that holds the token; created when absent
    required: false
    default: ""
  vault_ocid:
    description: OCID of the shared vault; empty means the vault the stack's own vault unit created
    required: false
    default: ""
  vault_unit_dir:
    description: Generated vault unit directory, read for its vault_id output only when vault_ocid is empty
    required: false
    default: ""
  region:
    description: The environment's OCI region (where the vault lives), not the tenancy home region
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Store the token in OCI Vault
      shell: bash
      run: python3 "${ACTION_PATH}/receiver_token_oci.py"
      env:
        ACTION_PATH: ${{ github.action_path }}
        RECEIVER_TOKEN: ${{ inputs.token }}
        SECRET_NAME: ${{ inputs.secret_name }}
        VAULT_OCID: ${{ inputs.vault_ocid }}
        VAULT_UNIT_DIR: ${{ inputs.vault_unit_dir }}
        OCI_REGION: ${{ inputs.region }}
        GITHUB_REPOSITORY: ${{ github.repository }}
