---
name: Setup yq
description: >
  Compatibility wrapper over ensure-tool for yq. Keeps the baked yq when it already reports the
  requested version, otherwise installs it with a verified checksum. New callers use ensure-tool.

inputs:
  version:
    description: yq version to ensure, exact (e.g. v4.54.1); the version the runner images bake
    required: false
    default: v4.54.1

outputs:
  version:
    description: Installed yq version string
    value: ${{ steps.verify.outputs.version }}

runs:
  using: composite
  steps:
    - name: Ensure yq
      uses: naviteq/github-actions/.github/actions/ensure-tool@c2fc7329e9182246e8ab12923dede3b6c2a57cee
      with:
        tool: yq
        version: ${{ inputs.version }}

    - name: Verify yq installation
      id: verify
      shell: bash
      run: |
        yq --version
        echo "version=$(yq --version)" >> "$GITHUB_OUTPUT"
