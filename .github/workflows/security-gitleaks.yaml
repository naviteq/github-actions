---
name: Security / Gitleaks (Secrets)
on:
  pull_request:
    branches: ["main"]
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner to use. Supports a single label or a JSON array of labels.
        required: false
        type: string
        default: ubuntu-24.04
      full_scan:
        description: Scan the full Git history instead of only the supplied commit range.
        required: false
        type: boolean
        default: false
      base_ref:
        description: Base ref (commit SHA, branch, or tag) to diff against. Defaults to the repository's default branch.
        required: false
        type: string
        default: ""
      head_ref:
        description: Head ref (commit SHA, branch, or tag) marking the tip of the scan range. Defaults to the current commit (github.sha).
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: gitleaks-security-${{ github.workflow }}-${{ github.ref }}-${{ inputs.full_scan || 'false' }}-${{ inputs.base_ref || 'default' }}-${{ inputs.head_ref || 'default' }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || (inputs.runner != '' && inputs.runner || (vars.DEFAULT_ORG_RUNNER || 'ubuntu-24.04')) }}
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT

          echo "::group::Detect runner architecture and resolve asset name"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) ASSET_ARCH="x64" ;;
            aarch64|arm64) ASSET_ARCH="arm64" ;;
            armv7l) ASSET_ARCH="armv7" ;;
            armv6l) ASSET_ARCH="armv6" ;;
            *)
              echo "Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac

          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ASSET="gitleaks_${GITLEAKS_VERSION}_${OS}_${ASSET_ARCH}.tar.gz"
          CHECKSUMS="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          echo "::endgroup::"

          echo "::group::Download Gitleaks archive and checksum file"
          echo "Downloading ${BASE_URL}/${ASSET}"
          curl -fsSL "${BASE_URL}/${ASSET}" -o "${ASSET}"
          curl -fsSL "${BASE_URL}/${CHECKSUMS}" -o "${CHECKSUMS}"
          echo "::endgroup::"

          echo "::group::Verify Gitleaks archive checksum"
          grep " ${ASSET}$" "${CHECKSUMS}" > "${ASSET}.sha256"
          sha256sum -c "${ASSET}.sha256"
          echo "::endgroup::"

          echo "::group::Install Gitleaks binary"
          tar -xzf "${ASSET}"
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

          gitleaks version
          echo "::endgroup::"

      - name: Run Gitleaks scan
        env:
          FULL_SCAN: ${{ inputs.full_scan }}
          BASE_REF: ${{ inputs.base_ref || format('origin/{0}', github.event.repository.default_branch) }}
          HEAD_REF: ${{ inputs.head_ref || github.sha }}
        run: |
          set -uo pipefail
          echo "::group::Run Gitleaks (full=${FULL_SCAN}, range=${BASE_REF}..${HEAD_REF})"
          if [[ "${FULL_SCAN}" == "true" ]]; then
            gitleaks git --verbose \
              --report-format json --report-path gitleaks-report.json || true
          else
            gitleaks git --verbose \
              --log-opts="--no-merges ${BASE_REF}..${HEAD_REF}" \
              --report-format json --report-path gitleaks-report.json || true
          fi
          echo "::endgroup::"

      - name: Publish results to GitHub Summary
        shell: bash
        env:
          FULL_SCAN: ${{ inputs.full_scan }}
          BASE_REF: ${{ inputs.base_ref || format('origin/{0}', github.event.repository.default_branch) }}
          HEAD_REF: ${{ inputs.head_ref || github.sha }}
        run: |
          set -uo pipefail
          trap 'echo "::endgroup::"' EXIT

          echo "::group::Write Gitleaks results to step summary"
          {
            echo "## 🔐 Gitleaks Secret Scan Results"

            if [[ "${FULL_SCAN}" == "true" ]]; then
              echo "Scope: full history"
            else
              echo "Scope: range \`${BASE_REF}..${HEAD_REF}\`"
            fi

            if jq -e 'length > 0' gitleaks-report.json > /dev/null; then
              echo "Secrets were detected. See details below:"
              echo '```json'
              cat gitleaks-report.json
              echo '```'
            else
              echo "✅ No secrets detected."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::endgroup::"

          echo "::group::Fail the job if Gitleaks detected secrets"
          if jq -e 'length > 0' gitleaks-report.json > /dev/null; then
            exit 1
          fi
          echo "::endgroup::"
