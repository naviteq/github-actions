---
name: Security / Trivy
on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner to use. Supports a single label or a JSON array of labels.
        required: false
        type: string
        default: ubuntu-24.04
      scan_type:
        description: Trivy scan type
        required: false
        type: string
        default: image
      image_ref:
        description: Image reference to scan when scan_type=image
        required: false
        type: string
        default: ""
      scan_ref:
        description: Path to scan when scan_type=fs
        required: false
        type: string
        default: "."
      registry:
        description: Container registry hostname for image scans
        required: false
        type: string
        default: ""
      registry_username:
        description: Registry username for image scans
        required: false
        type: string
        default: ""
      upload_sarif:
        description: Upload SARIF results to GitHub Security tab
        required: false
        type: boolean
        default: true
    secrets:
      registry_password:
        required: false

permissions: {}

jobs:
  trivy:
    name: Container Scan
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner || 'ubuntu-24.04' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      REGISTRY_PASSWORD: ${{ secrets.registry_password }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to container registry
        if: ${{ inputs.scan_type == 'image' && inputs.registry != '' && inputs.registry_username != '' && env.REGISTRY_PASSWORD != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry_username }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Run Trivy image scan (JSON)
        if: ${{ inputs.scan_type == 'image' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ inputs.image_ref }}
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          scanners: vuln
          hide-progress: true

      - name: Run Trivy filesystem scan (JSON)
        if: ${{ inputs.scan_type == 'fs' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan_ref }}
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: false
          scanners: vuln
          hide-progress: true

      - name: Run Trivy image scan (SARIF)
        if: ${{ inputs.scan_type == 'image' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ inputs.image_ref }}
          format: sarif
          output: trivy-report.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          scanners: vuln
          hide-progress: true

      - name: Run Trivy filesystem scan (SARIF)
        if: ${{ inputs.scan_type  == 'fs' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan_ref || true }}
          format: sarif
          output: trivy-report.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: false
          scanners: vuln
          hide-progress: true

      - name: Run Trivy image scan (text summary)
        if: ${{ inputs.scan_type == 'image' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ inputs.image_ref }}
          output: trivy.txt
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          scanners: vuln
          hide-progress: true

      - name: Run Trivy filesystem scan (text summary)
        if: ${{ (inputs.scan_type || 'fs') == 'fs' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan_ref }}
          output: trivy.txt
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          scanners: vuln
          hide-progress: true

      - name: Upload SARIF to GitHub Security
        if: ${{ always() && hashFiles('trivy-report.sarif') != '' && inputs.upload_sarif }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-report.sarif

      - name: Publish Trivy Output to Summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          echo "::group::Write Trivy scan summary to step summary"
          {
            echo "## 🔎 Trivy Scan Results"

            if [ "${{ inputs.scan_type }}" = "image" ]; then
              echo "- **Scan type:** image"
              echo "- **Target:** \`${{ inputs.image_ref }}\`"
            else
              echo "- **Scan type:** fs"
              echo "- **Target:** \`${{ inputs.scan_ref }}\`"
            fi

            if [ ! -f trivy-report.json ]; then
              echo ""
              echo "No Trivy JSON report was generated."
              exit 1
            fi

            CRITICAL_COUNT=$(jq '[.. | objects | select(has("Severity")) | select(.Severity == "CRITICAL")] | length' trivy-report.json)
            HIGH_COUNT=$(jq '[.. | objects | select(has("Severity")) | select(.Severity == "HIGH")] | length' trivy-report.json)

            echo "- **Critical vulnerabilities:** ${CRITICAL_COUNT}"
            echo "- **High vulnerabilities:** ${HIGH_COUNT}"
            echo ""

            if [[ -s trivy.txt ]]; then
              echo "### Security Output"
              echo "<details><summary>Click to expand</summary>"
              echo ""
              echo '```text'
              cat trivy.txt
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::endgroup::"
