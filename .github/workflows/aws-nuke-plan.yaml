---
name: AWS Nuke / Plan
# Plan-phase of the two-phase aws-nuke pattern.
#
# Runs aws-nuke in dry-run mode against the consumer-supplied config, uploads
# the full plan output as an artifact, computes a SHA-256 of the resource
# set, and opens an audit issue with the hash embedded for later approval.
#
# Why two phases: the apply phase refuses to run unless the resource-set
# hash recorded on this issue matches the resource set actually present at
# apply time. This prevents resources created during the approval window
# from being silently nuked.
on:
  workflow_call:
    inputs:
      aws_account_id:
        description: Declared AWS account ID. Verified via aws sts get-caller-identity before any destructive action.
        type: string
        required: true
      aws_region:
        description: AWS region used for STS calls (sts.amazonaws.com is global; any valid region works).
        type: string
        required: false
        default: us-east-1
      nuke_config_path:
        description: Path to the consumer-side aws-nuke.yaml config file (relative to the repository root).
        type: string
        required: true
      regions_allowlist:
        description: >-
          Explicit allowlist of regions the consumer config is permitted to target. Newline- or
          comma-separated. Never default to all regions. Validated against the regions: block of
          the supplied config file.
        type: string
        required: true
      assignee_resolution:
        description: >-
          Newline-separated Owner-tag-value -> github-handle fallback chain (e.g. "Owner=alice").
          Used to assign the audit issue to the right owner. Falls back to default_assignee, then
          to a maintainer of the consumer repo.
        type: string
        required: false
        default: ""
      default_assignee:
        description: Fallback GitHub handle if no Owner-tag mapping matches.
        type: string
        required: false
        default: ""
      paused:
        description: Top-level pause switch. When true, the workflow exits early without running aws-nuke.
        type: boolean
        required: false
        default: false
      runner:
        description: GitHub Actions runner to use. Supports a single label or a JSON array of labels.
        type: string
        required: false
        default: ubuntu-24.04
      aws_nuke_version:
        description: aws-nuke release version (pinned, not "latest", so the hash is reproducible).
        type: string
        required: false
        # renovate: datasource=github-releases depName=ekristen/aws-nuke
        default: 3.64.4
      artifact_retention_days:
        description: Plan artifact retention in days. Must be >= 90 for audit purposes.
        type: number
        required: false
        default: 90
      auto_approve:
        description: >-
          Opt-in: when set, AND the declared account appears in the org-level allowlist
          `vars.NUKE_AUTO_APPROVE_ACCOUNTS`, the plan job embeds an auto-approve marker in
          the audit-issue body and a bot identity (GitHub App) posts the
          `/approve nuke-<run-id>` comment so the consumer's existing apply trampoline
          (`issue_comment`) fires without a human reviewer. Production accounts
          (`RUNESTRA_PROD_ACCOUNTS`) and `NUKE_FREEZE` take precedence and cannot be bypassed.
          Requires `github_app_id` / `github_app_key` secrets — a comment posted with the
          default `GITHUB_TOKEN` will not trigger downstream `issue_comment` workflows.
        type: boolean
        required: false
        default: false
    secrets:
      aws_iam_role:
        description: AWS IAM role ARN to assume via OIDC. Trust policy must restrict by repository, repository_owner, and ref.
        required: true
      github_app_id:
        description: >-
          Optional. GitHub App client ID used to post the `/approve nuke-<run-id>` comment so the
          consumer's apply trampoline picks it up. Required when `auto_approve: true` — comments
          posted with the default `GITHUB_TOKEN` do not trigger downstream `issue_comment` workflows.
        required: false
      github_app_key:
        description: >-
          Optional. Private key for the GitHub App identified by `github_app_id`. Same requirement
          conditions as `github_app_id` — both must be set together for auto-approve to actually
          fire the apply trampoline.
        required: false
    outputs:
      issue_number:
        description: The audit issue number, when created.
        value: ${{ jobs.plan.outputs.issue_number }}
      resource_set_hash:
        description: SHA-256 of the planned resource set.
        value: ${{ jobs.plan.outputs.resource_set_hash }}
      artifact_name:
        description: Name of the uploaded plan artifact.
        value: ${{ jobs.plan.outputs.artifact_name }}
      empty_plan:
        description: "true when the dry-run produced zero resources (no issue created)."
        value: ${{ jobs.plan.outputs.empty_plan }}
      auto_approve_allowed:
        description: >-
          "true" when `auto_approve` was requested AND the declared account appears in
          `vars.NUKE_AUTO_APPROVE_ACCOUNTS` AND it is not in `RUNESTRA_PROD_ACCOUNTS`.
        value: ${{ jobs.plan.outputs.auto_approve_allowed }}

permissions: {}

jobs:
  plan:
    name: aws-nuke plan (dry-run)
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || (inputs.runner || 'ubuntu-24.04') }}
    permissions:
      contents: read
      id-token: write
      issues: write
    timeout-minutes: 60
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
      resource_set_hash: ${{ steps.hash.outputs.resource_set_hash }}
      artifact_name: ${{ steps.upload_meta.outputs.artifact_name }}
      empty_plan: ${{ steps.extract.outputs.empty_plan }}
      auto_approve_allowed: ${{ steps.auto_approve.outputs.auto_approve_allowed }}
    steps:
      - name: Honor pause switch
        id: pause
        env:
          PAUSED_INPUT: ${{ inputs.paused }}
          NUKE_FREEZE: ${{ vars.NUKE_FREEZE }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Evaluate pause switch and freeze flag"
          if [[ "${PAUSED_INPUT}" == "true" || "${NUKE_FREEZE,,}" == "true" ]]; then
            echo "::notice::aws-nuke plan paused (paused=${PAUSED_INPUT}, NUKE_FREEZE=${NUKE_FREEZE}). Exiting." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "::endgroup::"

      - name: Production-account guard
        if: ${{ steps.pause.outputs.skip != 'true' }}
        env:
          AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
          PROD_ACCOUNTS: ${{ vars.RUNESTRA_PROD_ACCOUNTS }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT
          echo "::group::Check declared account against production-account allowlist"
          if [[ -z "${PROD_ACCOUNTS:-}" ]]; then
            echo "::warning::RUNESTRA_PROD_ACCOUNTS org variable is unset. Production-account guard cannot enforce."
            exit 0
          fi
          IFS=',' read -r -a accounts <<< "${PROD_ACCOUNTS}"
          for acct in "${accounts[@]}"; do
            trimmed="$(printf '%s' "$acct" | tr -d '[:space:]')"
            if [[ -n "$trimmed" && "$trimmed" == "${AWS_ACCOUNT_ID}" ]]; then
              echo "::error::Refusing to run aws-nuke against production account ${AWS_ACCOUNT_ID} (matched RUNESTRA_PROD_ACCOUNTS)" >&2
              exit 1
            fi
          done

      - name: Resolve auto-approve eligibility
        id: auto_approve
        if: ${{ steps.pause.outputs.skip != 'true' }}
        env:
          AUTO_APPROVE_INPUT: ${{ inputs.auto_approve }}
          AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
          AUTO_APPROVE_ACCOUNTS: ${{ vars.NUKE_AUTO_APPROVE_ACCOUNTS }}
          PROD_ACCOUNTS: ${{ vars.RUNESTRA_PROD_ACCOUNTS }}
          APP_ID_SET: ${{ secrets.github_app_id != '' }}
          APP_KEY_SET: ${{ secrets.github_app_key != '' }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT
          echo "::group::Resolve auto-approve eligibility against org allowlist"
          # Precedence (load-bearing): NUKE_FREEZE > RUNESTRA_PROD_ACCOUNTS >
          # NUKE_AUTO_APPROVE_ACCOUNTS > human approval. Freeze is handled by
          # the pause step above; prod guard is handled by the step above.
          # Here we only enable auto-approve when ALL of: caller opted in,
          # the account is on the org allowlist, the account is NOT on the
          # prod blocklist (defense in depth — if both lists overlap, prod
          # wins), AND App-token secrets are wired (a comment posted with
          # the default GITHUB_TOKEN does not fire the apply trampoline).
          allowed="false"
          if [[ "${AUTO_APPROVE_INPUT}" != "true" ]]; then
            echo "auto-approve not requested by caller; skipping."
          elif [[ -z "${AUTO_APPROVE_ACCOUNTS:-}" ]]; then
            echo "::notice::auto_approve=true but NUKE_AUTO_APPROVE_ACCOUNTS org variable is unset; falling back to human approval."
          else
            IFS=',' read -r -a allow <<< "${AUTO_APPROVE_ACCOUNTS}"
            match=0
            for acct in "${allow[@]}"; do
              trimmed="$(printf '%s' "$acct" | tr -d '[:space:]')"
              if [[ -n "$trimmed" && "$trimmed" == "${AWS_ACCOUNT_ID}" ]]; then
                match=1
                break
              fi
            done
            if (( match == 0 )); then
              echo "::notice::Account ${AWS_ACCOUNT_ID} is not on NUKE_AUTO_APPROVE_ACCOUNTS; falling back to human approval."
            else
              prod_collision=0
              if [[ -n "${PROD_ACCOUNTS:-}" ]]; then
                IFS=',' read -r -a prod <<< "${PROD_ACCOUNTS}"
                for acct in "${prod[@]}"; do
                  trimmed="$(printf '%s' "$acct" | tr -d '[:space:]')"
                  if [[ -n "$trimmed" && "$trimmed" == "${AWS_ACCOUNT_ID}" ]]; then
                    prod_collision=1
                    break
                  fi
                done
              fi
              if (( prod_collision == 1 )); then
                # Should be unreachable — the production-account guard above
                # would have already failed the job. Belt-and-braces.
                echo "::error::Account ${AWS_ACCOUNT_ID} is on both RUNESTRA_PROD_ACCOUNTS and NUKE_AUTO_APPROVE_ACCOUNTS; refusing to auto-approve." >&2
                exit 1
              fi
              if [[ "${APP_ID_SET}" != "true" || "${APP_KEY_SET}" != "true" ]]; then
                # Hard-fail rather than silently degrade to human approval.
                # Without an App token the bot's /approve comment is posted
                # with GITHUB_TOKEN and the consumer's `issue_comment`
                # trampoline never fires — auto-approve becomes a no-op and
                # the operator has no signal that something is wrong.
                echo "::error::auto_approve=true requires both github_app_id and github_app_key secrets. Comments posted by GITHUB_TOKEN do not trigger downstream issue_comment workflows." >&2
                exit 1
              fi
              allowed="true"
              echo "Auto-approve eligible: account ${AWS_ACCOUNT_ID} matches NUKE_AUTO_APPROVE_ACCOUNTS."
            fi
          fi
          echo "auto_approve_allowed=${allowed}" >> "$GITHUB_OUTPUT"

      - name: Cron jitter
        if: ${{ steps.pause.outputs.skip != 'true' && github.event_name == 'schedule' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Apply cron jitter to stagger scheduled runs"
          jitter=$(( RANDOM % 120 ))
          echo "Sleeping ${jitter}s to spread scheduled runs."
          sleep "${jitter}"
          echo "::endgroup::"

      - name: Checkout consumer repository
        if: ${{ steps.pause.outputs.skip != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install AWS CLI v2
        if: ${{ steps.pause.outputs.skip != 'true' }}
        uses: naviteq/github-actions/.github/actions/setup-aws-cli@167682cc27f6585cc85bb0f526ae9f5af2a1290b

      - name: Configure AWS credentials (OIDC)
        if: ${{ steps.pause.outputs.skip != 'true' }}
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.aws_iam_role }}
          role-session-name: github-${{ github.repository_id }}-${{ github.actor_id }}-nuke-plan
          aws-region: ${{ inputs.aws_region }}

      - name: Verify caller identity matches declared account
        if: ${{ steps.pause.outputs.skip != 'true' }}
        env:
          DECLARED_ACCOUNT_ID: ${{ inputs.aws_account_id }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT
          echo "::group::Verify STS caller identity matches declared account"
          actual="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "${actual}" != "${DECLARED_ACCOUNT_ID}" ]]; then
            echo "::error::STS account mismatch. Declared=${DECLARED_ACCOUNT_ID} actual=${actual}. Refusing to run." >&2
            exit 1
          fi
          echo "Account verified: ${actual}"

      - name: Validate config regions against allowlist
        if: ${{ steps.pause.outputs.skip != 'true' }}
        env:
          NUKE_CONFIG: ${{ inputs.nuke_config_path }}
          REGIONS_ALLOWLIST: ${{ inputs.regions_allowlist }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT

          echo "::group::Verify nuke config file exists"
          if [[ ! -f "${NUKE_CONFIG}" ]]; then
            echo "::error::nuke_config_path '${NUKE_CONFIG}' not found in repository." >&2
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Normalize regions allowlist"
          # Normalize allowlist: newlines or commas -> one entry per line.
          mapfile -t allow < <(printf '%s\n' "${REGIONS_ALLOWLIST}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | sort -u)
          if (( ${#allow[@]} == 0 )); then
            echo "::error::regions_allowlist is empty. Explicit regions required." >&2
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Extract regions from nuke config"
          # Extract regions: from config (simple YAML grep; sufficient for the documented schema).
          mapfile -t config_regions < <(awk '
            /^regions:[[:space:]]*$/ { in_block=1; next }
            in_block && /^[a-zA-Z]/ { in_block=0 }
            in_block && /^[[:space:]]*-/ { sub(/^[[:space:]]*-[[:space:]]*/, ""); gsub(/["'\'']/, ""); print }
          ' "${NUKE_CONFIG}" | sort -u)

          if (( ${#config_regions[@]} == 0 )); then
            echo "::error::nuke config has no regions: block; explicit regions required." >&2
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Verify each config region is in allowlist"
          for r in "${config_regions[@]}"; do
            allowed=0
            for a in "${allow[@]}"; do
              if [[ "${r}" == "${a}" ]]; then allowed=1; break; fi
            done
            if (( allowed == 0 )); then
              echo "::error::Config region '${r}' is not in regions_allowlist." >&2
              exit 1
            fi
          done

          printf '%s\n' "${config_regions[@]}" > regions.txt
          echo "Validated $(wc -l < regions.txt) region(s) against allowlist."
          echo "::endgroup::"

      - name: Install aws-nuke
        if: ${{ steps.pause.outputs.skip != 'true' }}
        uses: naviteq/github-actions/.github/actions/aws-nuke-install@167682cc27f6585cc85bb0f526ae9f5af2a1290b
        with:
          version: ${{ inputs.aws_nuke_version }}

      - name: Run aws-nuke dry-run
        if: ${{ steps.pause.outputs.skip != 'true' }}
        env:
          NUKE_CONFIG: ${{ inputs.nuke_config_path }}
        shell: bash
        run: |
          # Drop -e so the pipeline below can fail without aborting before we
          # capture the real aws-nuke exit code via PIPESTATUS.
          set -uo pipefail
          trap 'echo "::endgroup::"' EXIT
          echo "::group::Run aws-nuke dry-run and capture plan output"
          # Dry-run is the default for `aws-nuke run`; --no-dry-run would make it destructive.
          # stdbuf forces line buffering so progress is visible live in the workflow log
          # (long aws-nuke runs otherwise look stuck). Tee preserves file outputs for
          # downstream hashing/parsing while echoing both streams to the GHA log.
          stdbuf -oL -eL aws-nuke run \
            --config "${NUKE_CONFIG}" \
            --log-level info \
            --log-format json \
            --no-prompt \
            2> >(tee nuke-plan.log >&2) \
            | tee nuke-plan.json
          rc=${PIPESTATUS[0]}
          if (( rc != 0 )); then
            echo "::warning::aws-nuke dry-run exited with rc=${rc}. Proceeding to parse partial output."
          fi

      - name: Extract resource set
        id: extract
        if: ${{ steps.pause.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT

          echo "::group::Extract resource tuples from aws-nuke plan"
          # aws-nuke's JSON log lines carry resource events with msg ~= "would remove resource".
          # We extract (region, type, id) tuples, sort deterministically, and write resource-set.txt.
          jq -r '
            select(type == "object") |
            select(.msg // "" | test("would remove"; "i")) |
            [
              (.region // .Region // ""),
              (.type // .ResourceType // ""),
              (.name // .id // .ID // .ResourceID // "")
            ] | @tsv
          ' nuke-plan.json 2>/dev/null \
            | awk -F'\t' 'NF==3 && $2 != "" && $3 != ""' \
            | sort -u > resource-set.txt || true
          echo "::endgroup::"

          echo "::group::Record resource count and empty-plan flag"
          count="$(wc -l < resource-set.txt | tr -d ' ')"
          echo "resource_count=${count}" >> "$GITHUB_OUTPUT"
          if [[ "${count}" == "0" ]]; then
            echo "empty_plan=true" >> "$GITHUB_OUTPUT"
            {
              echo "## aws-nuke plan"
              echo ""
              echo "No resources matched. No issue created."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "empty_plan=false" >> "$GITHUB_OUTPUT"
          fi
          echo "::endgroup::"

          # Aggregate per-type counts only when the plan is non-empty. The render
          # step is gated on empty_plan != 'true', so type_count is only ever
          # consumed when this branch runs. Generating it unconditionally would
          # waste work and could mislead a reader of the run log.
          if [[ "${count}" != "0" ]]; then
            echo "::group::Aggregate resource-type counts"
            awk -F'\t' '{count[$2]++} END {for (t in count) print t"\t"count[t]}' \
              resource-set.txt > type-counts.tsv
            type_count="$(wc -l < type-counts.tsv | tr -d ' ')"
            echo "type_count=${type_count}" >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
          fi

      - name: Compute resource-set hash
        id: hash
        if: ${{ steps.pause.outputs.skip != 'true' && steps.extract.outputs.empty_plan != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Compute SHA-256 of resource set"
          sha="$(sha256sum resource-set.txt | awk '{print $1}')"
          printf '%s\n' "${sha}" > resource-set.sha256
          echo "resource_set_hash=${sha}" >> "$GITHUB_OUTPUT"
          echo "Hash: ${sha}"
          echo "::endgroup::"

      - name: Upload plan artifact
        id: upload
        if: ${{ steps.pause.outputs.skip != 'true' && steps.extract.outputs.empty_plan != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aws-nuke-plan-${{ github.run_id }}
          path: |
            nuke-plan.json
            nuke-plan.log
            resource-set.txt
            resource-set.sha256
            regions.txt
            type-counts.tsv
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

      - name: Capture artifact name
        id: upload_meta
        if: ${{ steps.pause.outputs.skip != 'true' && steps.extract.outputs.empty_plan != 'true' }}
        shell: bash
        run: |
          echo "artifact_name=aws-nuke-plan-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Re-entrancy check
        id: reentrancy
        if: ${{ steps.pause.outputs.skip != 'true' && steps.extract.outputs.empty_plan != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
          HASH: ${{ steps.hash.outputs.resource_set_hash }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Look up existing pending issue with matching hash marker"
          # Use a stable machine-readable marker embedded in the issue body to detect duplicates,
          # so fuzzy title matching can't be exploited.
          marker="<!-- nuke:hash=${HASH} account=${AWS_ACCOUNT_ID} -->"
          existing="$(gh issue list \
            --repo "${{ github.repository }}" \
            --label nuke:pending \
            --state open \
            --json number,body \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .number" \
            | head -n1)"
          if [[ -n "${existing}" ]]; then
            echo "existing_issue=${existing}" >> "$GITHUB_OUTPUT"
          else
            echo "existing_issue=" >> "$GITHUB_OUTPUT"
          fi
          echo "::endgroup::"

      - name: Post re-run notice on existing issue
        if: ${{ steps.pause.outputs.skip != 'true' && steps.extract.outputs.empty_plan != 'true' && steps.reentrancy.outputs.existing_issue != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.reentrancy.outputs.existing_issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT: ${{ steps.upload_meta.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Comment re-run notice on existing audit issue"
          gh issue comment "${ISSUE}" \
            --repo "${{ github.repository }}" \
            --body "Plan re-run produced the same resource set. Run: ${RUN_URL} (artifact: \`${ARTIFACT}\`)."
          echo "::endgroup::"

      - name: Resolve assignees
        id: assignees
        if: ${{ steps.pause.outputs.skip != 'true' && steps.extract.outputs.empty_plan != 'true' && steps.reentrancy.outputs.existing_issue == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MAP: ${{ inputs.assignee_resolution }}
          DEFAULT: ${{ inputs.default_assignee }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT

          echo "::group::Extract Owner tag values from plan output"
          # Extract distinct Owner tag values from the plan JSON (best-effort).
          mapfile -t owners < <(jq -r '
            select(type == "object") |
            (.tags // .Tags // {}) |
            (."Owner" // ."owner" // empty)
          ' nuke-plan.json 2>/dev/null | sort -u | grep -v '^$' || true)
          echo "::endgroup::"

          echo "::group::Map Owner tag values to GitHub handles via resolution chain"
          assignees=()
          while IFS= read -r line; do
            line="${line%%#*}"
            line="$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [[ -z "$line" ]] && continue
            key="${line%%=*}"
            val="${line#*=}"
            for o in "${owners[@]}"; do
              if [[ "$o" == "$key" ]]; then
                assignees+=("$val")
              fi
            done
          done <<< "${MAP}"
          echo "::endgroup::"

          echo "::group::Apply default assignee and repo-maintainer fallbacks"
          if (( ${#assignees[@]} == 0 )) && [[ -n "${DEFAULT}" ]]; then
            assignees+=("${DEFAULT}")
          fi

          if (( ${#assignees[@]} == 0 )); then
            fallback="$(gh api "repos/${{ github.repository }}/collaborators?permission=maintain" --jq '.[0].login // empty' 2>/dev/null || true)"
            if [[ -n "${fallback}" ]]; then
              assignees+=("${fallback}")
            fi
          fi
          echo "::endgroup::"

          echo "::group::Deduplicate assignees and export CSV"
          # Deduplicate, drop empty entries.
          if (( ${#assignees[@]} > 0 )); then
            mapfile -t assignees < <(printf '%s\n' "${assignees[@]}" | grep -v '^$' | sort -u)
          fi

          printf '%s\n' "${assignees[@]:-}" > assignees.txt
          csv="$(paste -sd ',' assignees.txt || true)"
          echo "assignees_csv=${csv}" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: Render issue body
        id: render
        if: ${{ steps.pause.outputs.skip != 'true' && steps.extract.outputs.empty_plan != 'true' && steps.reentrancy.outputs.existing_issue == '' }}
        env:
          AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
          HASH: ${{ steps.hash.outputs.resource_set_hash }}
          ARTIFACT: ${{ steps.upload_meta.outputs.artifact_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESOURCE_COUNT: ${{ steps.extract.outputs.resource_count }}
          TYPE_COUNT: ${{ steps.extract.outputs.type_count }}
          AUTO_APPROVE_ALLOWED: ${{ steps.auto_approve.outputs.auto_approve_allowed }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT

          echo "::group::Compute short hash and regions CSV for issue body"
          short_hash="${HASH:0:12}"
          regions_csv="$(paste -sd ',' regions.txt || true)"
          echo "::endgroup::"

          # GitHub's GraphQL `createIssue` mutation rejects bodies longer than
          # 65,536 characters. On large environments the per-resource bullets
          # alone can blow past that, so the render below is bounded: the
          # markers, table, hash and footer are load-bearing (the parse step
          # regexes them) and are never truncated; only the per-type <details>
          # bullets are trimmed, with a notice pointing operators at the full
          # artifact. The 2 KB safety margin absorbs UTF-8 expansion and any
          # future header additions before hitting the hard cap.
          GH_ISSUE_BODY_MAX=65536
          BODY_SAFETY_MARGIN=2048
          effective_cap=$(( GH_ISSUE_BODY_MAX - BODY_SAFETY_MARGIN ))
          # Reserve a fixed byte budget for the truncation notice so it always
          # has room to render between the details and the suffix.
          TRUNCATION_NOTICE_BYTES=512

          echo "::group::Render static prefix (markers + table + hash + total) to issue-body.md"
          {
            echo "<!-- nuke:hash=${HASH} account=${AWS_ACCOUNT_ID} -->"
            if [[ "${AUTO_APPROVE_ALLOWED}" == "true" ]]; then
              # Machine-readable marker consumed by the apply workflow to
              # detect that this issue's plan was sanctioned for auto-approve
              # at plan time. The apply workflow ALSO re-resolves
              # `vars.NUKE_AUTO_APPROVE_ACCOUNTS` (defense in depth) before
              # honoring the marker — a hand-edited issue body alone cannot
              # bypass the human gate.
              echo "<!-- nuke:auto-approve=true -->"
            fi
            echo ""
            echo "## aws-nuke plan pending approval"
            echo ""
            if [[ "${AUTO_APPROVE_ALLOWED}" == "true" ]]; then
              echo "> **Auto-approve enabled** for this account. The plan bot will post the \`/approve nuke-${RUN_ID}\` comment below; the consumer's apply trampoline picks that up via \`issue_comment\` and runs the apply automatically."
              echo ""
            fi
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Account | \`${AWS_ACCOUNT_ID}\` |"
            echo "| Regions | \`${regions_csv}\` |"
            echo "| Resource count | \`${RESOURCE_COUNT}\` |"
            echo "| Plan run | [${RUN_ID}](${RUN_URL}) |"
            echo "| Artifact | \`${ARTIFACT}\` (download from the plan run) |"
            echo ""
            echo "### Resource-set SHA-256"
            echo ""
            echo "\`\`\`"
            echo "${HASH}"
            echo "\`\`\`"
            echo ""
            echo "### Resources by type"
            echo ""
            echo "**Total: ${RESOURCE_COUNT} resources across ${TYPE_COUNT} types**"
            echo ""
          } > issue-body.md
          prefix_bytes=$(wc -c < issue-body.md | tr -d ' ')
          echo "prefix_bytes=${prefix_bytes}"
          echo "::endgroup::"

          echo "::group::Render static suffix (approval instructions) to suffix.md"
          {
            if [[ "${AUTO_APPROVE_ALLOWED}" == "true" ]]; then
              echo "### Auto-approve"
              echo ""
              echo "The plan bot will post \`/approve nuke-${RUN_ID}\` on this issue. The consumer's apply trampoline picks that up via \`issue_comment\` and runs the apply with the same safety checks (STS verification, regions allowlist, hash drift, in-progress marker, SNS audit event) used for human-approved runs. The CODEOWNERS check is skipped only because this issue carries the \`nuke:auto-approve=true\` marker AND the account is on \`NUKE_AUTO_APPROVE_ACCOUNTS\` — both are re-validated at apply time."
            else
              echo "### To approve"
              echo ""
              echo "Comment **exactly** the following on this issue:"
              echo ""
              echo "\`\`\`"
              echo "/approve nuke-${RUN_ID}"
              echo "\`\`\`"
              echo ""
              echo "- Ambiguous text (\"approved\", \"lgtm\", \"Approved!\") will be rejected."
              echo "- Your handle must appear in the consumer repo's CODEOWNERS on the default branch."
              echo "- If the resource set changes between plan and approval, apply will refuse on hash mismatch."
              echo "- Title prefix \`nuke:pending\` (and this comment) are load-bearing — do not edit."
            fi
          } > suffix.md
          suffix_bytes=$(wc -c < suffix.md | tr -d ' ')
          echo "suffix_bytes=${suffix_bytes}"
          echo "::endgroup::"

          echo "::group::Render <details> resource bullets within byte budget"
          # The <details> section is the only part that can grow unbounded with
          # the resource set, so it is the only part we truncate. Hash drift
          # detection is unaffected: aws-nuke-apply.yaml hashes resource-set.txt
          # (the artifact), not the rendered body.
          # Group rows by type into one <details> per type. The blank lines
          # after <summary> and before </details> are load-bearing: GitHub's
          # Markdown-in-HTML requires them to re-enter markdown parsing mode
          # so the inner `- ` bullets render as a list instead of literal text.
          available_for_details=$(( effective_cap - prefix_bytes - suffix_bytes - TRUNCATION_NOTICE_BYTES ))
          if (( available_for_details < 0 )); then
            available_for_details=0
          fi
          echo "available_for_details=${available_for_details}"

          awk -F'\t' '{print $2"\t"$1"\t"$3}' resource-set.txt \
            | sort \
            | awk -F'\t' -v counts_file=type-counts.tsv -v budget="${available_for_details}" -v rendered_file=rendered-count.txt '
                BEGIN {
                  while ((getline line < counts_file) > 0) {
                    n = split(line, parts, "\t")
                    if (n >= 2) counts[parts[1]] = parts[2]
                  }
                  close(counts_file)
                  prev = ""
                  used = 0
                  emitted = 0
                  truncated = 0
                  in_block = 0
                }
                function emit(line,    len) {
                  len = length(line) + 1
                  if (used + len > budget) {
                    truncated = 1
                    return 0
                  }
                  print line
                  used += len
                  return 1
                }
                # `next` (not `exit`) is load-bearing: aborting the second
                # awk would SIGPIPE the upstream sort/awk and trip pipefail.
                # Read every record but stop emitting once `truncated` flips.
                {
                  if (truncated) next
                  if ($1 != prev) {
                    if (prev != "") {
                      if (!emit("")) { next }
                      if (!emit("</details>")) { next }
                      in_block = 0
                      if (!emit("")) { next }
                    }
                    if (!emit("<details>")) { next }
                    in_block = 1
                    if (!emit("<summary><strong>" $1 "</strong> (" counts[$1] ")</summary>")) { next }
                    if (!emit("")) { next }
                    prev = $1
                  }
                  if (!emit("- `" $2 "` `" $3 "`")) { next }
                  emitted++
                }
                END {
                  if (in_block) {
                    # Close the currently open block cleanly. These tail bytes
                    # are intentionally not budget-tracked — the
                    # TRUNCATION_NOTICE_BYTES reservation above covers them.
                    print ""
                    print "</details>"
                  }
                  print emitted > rendered_file
                  print (truncated ? 1 : 0) >> rendered_file
                }
              ' > details.md
          echo "::endgroup::"

          echo "::group::Assemble issue-body.md (details + optional truncation notice + suffix)"
          emitted_bullets=$(sed -n '1p' rendered-count.txt)
          truncated_flag=$(sed -n '2p' rendered-count.txt)
          emitted_bullets="${emitted_bullets:-0}"
          truncated_flag="${truncated_flag:-0}"

          cat details.md >> issue-body.md

          if [[ "${truncated_flag}" == "1" ]]; then
            {
              echo ""
              echo "> **Note:** Resource list truncated to fit GitHub's 65,536-character issue-body limit."
              echo "> Showing ${emitted_bullets} of ${RESOURCE_COUNT} resources. The full plan is in the"
              echo "> artifact \`${ARTIFACT}\` attached to the [plan run](${RUN_URL})."
              echo ""
            } >> issue-body.md
            echo "render_truncated=true" >> "$GITHUB_OUTPUT"
            echo "rendered_bullets=${emitted_bullets}" >> "$GITHUB_OUTPUT"
          else
            echo "render_truncated=false" >> "$GITHUB_OUTPUT"
          fi

          echo "" >> issue-body.md
          cat suffix.md >> issue-body.md
          echo "::endgroup::"

          echo "::group::Assert final body fits under GitHub's 65,536-character limit"
          final_bytes=$(wc -c < issue-body.md | tr -d ' ')
          echo "final_bytes=${final_bytes} (max=${GH_ISSUE_BODY_MAX})"
          if (( final_bytes > GH_ISSUE_BODY_MAX )); then
            echo "::error::Rendered issue body is ${final_bytes} bytes, exceeds GitHub's ${GH_ISSUE_BODY_MAX}-character limit." >&2
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Build issue title"
          short_regions_csv="$(printf '%s' "${regions_csv}" | head -c 60)"
          echo "title=aws-nuke pending: account=${AWS_ACCOUNT_ID} regions=${short_regions_csv} hash=${short_hash}" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: Ensure aws-nuke labels exist
        if: ${{ steps.pause.outputs.skip != 'true' && steps.extract.outputs.empty_plan != 'true' && steps.reentrancy.outputs.existing_issue == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT
          echo "::group::Ensure aws-nuke labels exist in consumer repo"
          # `gh issue create --label` (and `gh issue edit --add-label` in the apply phase)
          # fail if the label is missing in the consumer repo. Create the three labels
          # idempotently up front so first-time consumers don't need manual setup.
          ensure_label() {
            local name="$1" color="$2" desc="$3"
            if gh label create "${name}" \
                --repo "${{ github.repository }}" \
                --color "${color}" \
                --description "${desc}" 2>/dev/null; then
              echo "Created label: ${name}"
              return 0
            fi
            # Either it already exists, or creation failed for another reason.
            # Verify presence so we surface real failures instead of swallowing them.
            if gh label list --repo "${{ github.repository }}" \
                --search "${name}" \
                --json name \
                --jq ".[] | select(.name == \"${name}\") | .name" \
                | grep -qx "${name}"; then
              echo "Label already present: ${name}"
            else
              echo "::error::Failed to ensure label '${name}' exists in ${{ github.repository }}." >&2
              return 1
            fi
          }
          ensure_label "nuke:pending"  "FBCA04" "aws-nuke: plan awaiting approval"
          ensure_label "nuke:applying" "0E8A16" "aws-nuke: apply in progress"
          ensure_label "nuke:failed"   "B60205" "aws-nuke: apply failed"
          echo "::endgroup::"

      - name: Create audit issue
        id: create_issue
        if: ${{ steps.pause.outputs.skip != 'true' && steps.extract.outputs.empty_plan != 'true' && steps.reentrancy.outputs.existing_issue == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ASSIGNEES_CSV: ${{ steps.assignees.outputs.assignees_csv }}
          ISSUE_TITLE: ${{ steps.render.outputs.title }}
          RENDER_TRUNCATED: ${{ steps.render.outputs.render_truncated }}
          RENDERED_BULLETS: ${{ steps.render.outputs.rendered_bullets }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT

          echo "::group::Open audit issue on consumer repository"
          extra=()
          if [[ -n "${ASSIGNEES_CSV}" ]]; then
            extra+=(--assignee "${ASSIGNEES_CSV}")
          fi
          url="$(gh issue create \
            --repo "${{ github.repository }}" \
            --label nuke:pending \
            --title "${ISSUE_TITLE}" \
            --body-file issue-body.md \
            "${extra[@]}")"
          num="${url##*/}"
          echo "issue_number=${num}" >> "$GITHUB_OUTPUT"
          echo "issue_url=${url}" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

          echo "::group::Write step summary"
          {
            echo "## aws-nuke plan"
            echo ""
            echo "- Audit issue: ${url}"
            echo "- Resource-set SHA-256: \`${{ steps.hash.outputs.resource_set_hash }}\`"
            echo "- Artifact: \`aws-nuke-plan-${{ github.run_id }}\`"
            if [[ "${RENDER_TRUNCATED}" == "true" ]]; then
              echo "- Resource list truncated in audit issue (showing ${RENDERED_BULLETS} of ${{ steps.extract.outputs.resource_count }}) — full set in artifact \`aws-nuke-plan-${{ github.run_id }}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::endgroup::"

      # Auto-approve fan-out
      # --------------------
      # When the account is on the org-level allowlist AND a fresh audit
      # issue was just opened, the plan bot posts the `/approve nuke-<run-id>`
      # comment on the issue. The consumer's existing apply trampoline
      # (`on: issue_comment`) picks that comment up and calls the apply
      # workflow — same code path as a human approval, no separate chained
      # job in this workflow.
      #
      # The comment MUST be posted with a GitHub App token (or PAT) rather
      # than the default GITHUB_TOKEN — comments posted with GITHUB_TOKEN
      # do not fire downstream `issue_comment` workflows. The eligibility
      # step above hard-fails if `auto_approve=true` is set without the
      # required `github_app_id`/`github_app_key` secrets, so by the time
      # this step runs we know they are present.
      - name: Generate GitHub App token for auto-approve
        id: app_token
        if: ${{ steps.pause.outputs.skip != 'true' && steps.extract.outputs.empty_plan != 'true' && steps.reentrancy.outputs.existing_issue == '' && steps.auto_approve.outputs.auto_approve_allowed == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.github_app_id }}
          private-key: ${{ secrets.github_app_key }}

      - name: Post auto-approve comment on audit issue
        if: ${{ steps.pause.outputs.skip != 'true' && steps.extract.outputs.empty_plan != 'true' && steps.reentrancy.outputs.existing_issue == '' && steps.auto_approve.outputs.auto_approve_allowed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE: ${{ steps.create_issue.outputs.issue_number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT
          echo "::group::Bot posts /approve comment to fire apply trampoline"
          # Posting via App token ensures the consumer repo's `on: issue_comment`
          # trampoline actually fires — comments posted with GITHUB_TOKEN are
          # silently ignored by downstream workflow triggers.
          gh issue comment "${ISSUE}" \
            --repo "${{ github.repository }}" \
            --body "/approve nuke-${RUN_ID}"
