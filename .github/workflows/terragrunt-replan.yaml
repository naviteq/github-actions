---
# Plans a merged pull request's units again at the merged commit, because the base moved
# under its plan, and opens the apply issue an approver answers. → docs/terragrunt-apply.md
name: Terragrunt re-plan

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner to use. Supports a single label or a JSON array of labels.
        required: false
        type: string
        default: ubuntu-24.04
      working_directory:
        description: Directory the units live under, relative to the repository root
        required: false
        type: string
        default: "."
      engine:
        description: Engine Terragrunt drives, tofu or terraform
        required: false
        type: string
        default: tofu
      terragrunt_version:
        description: Terragrunt version; read from the repository's .terragrunt-version when empty
        required: false
        type: string
        default: ""
      opentofu_version:
        description: OpenTofu version; read from the repository's .opentofu-version when empty
        required: false
        type: string
        default: ""
      terraform_version:
        description: Terraform version for engine terraform; read from the repository's .terraform-version when empty
        required: false
        type: string
        default: ""
      filter:
        description: The units to plan again, one Terragrunt filter per line; the apply gate's replan output
        required: true
        type: string
      ref:
        description: Full SHA of the merged commit to plan them at; the apply gate's replan_ref output
        required: true
        type: string
      pr:
        description: The merged pull request the re-plan belongs to; the apply gate's replan_pr output
        required: false
        type: string
        default: ""
      parallelism:
        description: How many units Terragrunt plans at once
        required: false
        type: number
        default: 4
      github_environment:
        description: GitHub Environment the plan jobs run in, for a role whose trust policy matches on it; empty for none
        required: false
        type: string
        default: ""
      aws_region:
        description: Assume the aws_iam_role secret in this region; the default for a profile that names no region
        required: false
        type: string
        default: ""
      config_file:
        description: YAML file with env_vars and credential profiles, relative to the repository root; replaces the profiles and env_vars inputs
        required: false
        type: string
        default: ""
      profiles:
        description: YAML credential profiles, as in terragrunt-plan, naming the read-only roles that plan
        required: false
        type: string
        default: ""
      env_vars:
        description: Non-secret KEY=VALUE lines exported before planning
        required: false
        type: string
        default: ""
      plan_recipient:
        description: age public key the plans are encrypted to, as in terragrunt-plan; the apply holds the private key
        required: true
        type: string
      provider_cache:
        description: Restore the provider cache the default branch saved
        required: false
        type: boolean
        default: true
      provider_cache_persist:
        description: Keep the provider cache in the Actions cache between jobs; false downloads each job's providers once and shares them between its units
        required: false
        type: boolean
        default: true
      provider_cache_registries:
        description: Extra provider registry hostnames to cache, comma-separated, besides the two public ones
        required: false
        type: string
        default: ""
      provider_mirror_url:
        description: Provider network mirror for the two public registries' providers, https://<host>/v1/mirror/ for boring-registry (http:// reaches Terragrunt's provider cache only); probed first, and downloads stay direct with a warning when it does not answer
        required: false
        type: string
        default: ""
      provider_mirror_ca_file:
        description: PEM file, relative to the repository root, with the CA behind an https provider_mirror_url whose certificate the runner does not trust, e.g. a private in-cluster CA
        required: false
        type: string
        default: ""
      dependency_outputs_from_state:
        description: Read the outputs of a dependency outside the run straight from its S3 state, without init; turn off for OpenTofu state encryption
        required: false
        type: boolean
        default: true
      approvers:
        description: Comma-separated GitHub logins allowed to approve; empty reads vars.TERRAGRUNT_APPLY_APPROVERS
        required: false
        type: string
        default: ""
      second_approver_cost:
        description: The monthly cost delta above which the issue asks two approvers; empty reads vars.TERRAGRUNT_APPLY_SECOND_APPROVER_COST, and empty there never asks
        required: false
        type: string
        default: ""
      label:
        description: Label prefix of the apply issues, as the apply gate's
        required: false
        type: string
        default: terragrunt-apply
      artifact_retention_days:
        description: How long the encrypted plans are kept, and so how long the issue can be approved
        required: false
        type: number
        default: 14
    secrets:
      naviteq_github_app_id:
        description: GitHub App id; with the key, mints a read-only token so private git sources resolve
        required: false
      naviteq_github_client_id:
        description: GitHub App client ID. Preferred over naviteq_github_app_id, which is the deprecated fallback.
        required: false
      naviteq_github_app_key:
        description: Private key of that GitHub App
        required: false
      runestra_client_id:
        description: Runestra registry client id, exchanged for a registry token
        required: false
      runestra_client_secret:
        description: Runestra registry client secret
        required: false
      runestra_registry_token:
        description: Static Runestra registry token; preferred over the client id and secret, which cost an Auth0 token per job
        required: false
      aws_iam_role:
        description: AWS role assumed through OIDC when aws_region is set; it only plans, read-only is enough
        required: false
      oci_oidc_domain_url:
        description: OCI Identity Domain URL, for a profile with oci_region; also the token audience
        required: false
      oci_oidc_client_id:
        description: OAuth client ID of the identity domain's Confidential Application, for a profile with oci_region
        required: false
      oci_oidc_client_secret:
        description: OAuth client secret of that application; reaches no OCI API on its own
        required: false
      oci_tenancy_ocid:
        description: OCID of the tenancy a profile with oci_region must authenticate into; a mismatch fails the job
        required: false
      oci_s3_access_key_id:
        description: Customer Secret Key ID the S3-compatible state backend signs with, for a profile with oci_region
        required: false
      oci_s3_secret_access_key:
        description: Customer Secret Key secret that goes with oci_s3_access_key_id
        required: false
      terragrunt_extra_env:
        description: KEY=VALUE lines exported with masked values; with profiles, a job gets only the keys its profile lists
        required: false
      infracost_api_key:
        description: Infracost API key, for the cost estimate the issue shows and the two-approver threshold reads
        required: false
    outputs:
      state:
        description: pending when an issue was opened, by-hand when CI applies none of its units, no-changes when the re-plan changes nothing
        value: ${{ jobs.request.outputs.state }}
      issue:
        description: The issue opened, if any
        value: ${{ jobs.request.outputs.issue }}
      changes:
        description: JSON list of each unit's counts
        value: ${{ jobs.plan.outputs.changes }}

permissions: {}

# One request at a time per repository and directory; a queued one waits, never cancels.
concurrency:
  group: terragrunt-replan-${{ github.repository }}-${{ inputs.working_directory }}
  cancel-in-progress: false

jobs:
  plan:
    uses: naviteq/github-actions/.github/workflows/terragrunt-plan.yaml@efd0c711d87cc906bb5adc9e14ac293d29f83b1a
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    with:
      runner: ${{ inputs.runner }}
      working_directory: ${{ inputs.working_directory }}
      engine: ${{ inputs.engine }}
      terragrunt_version: ${{ inputs.terragrunt_version }}
      opentofu_version: ${{ inputs.opentofu_version }}
      terraform_version: ${{ inputs.terraform_version }}
      ref: ${{ inputs.ref }}
      filter: ${{ inputs.filter }}
      filter_affected: false
      parallelism: ${{ inputs.parallelism }}
      github_environment: ${{ inputs.github_environment }}
      aws_region: ${{ inputs.aws_region }}
      profiles: ${{ inputs.profiles }}
      config_file: ${{ inputs.config_file }}
      env_vars: ${{ inputs.env_vars }}
      pr_comment: false
      plan_recipient: ${{ inputs.plan_recipient }}
      artifact_name: terragrunt-replan-pr${{ inputs.pr }}-${{ github.run_id }}-${{ github.run_attempt }}
      artifact_retention_days: ${{ inputs.artifact_retention_days }}
      provider_cache: ${{ inputs.provider_cache }}
      provider_cache_persist: ${{ inputs.provider_cache_persist }}
      provider_cache_registries: ${{ inputs.provider_cache_registries }}
      provider_mirror_url: ${{ inputs.provider_mirror_url }}
      provider_mirror_ca_file: ${{ inputs.provider_mirror_ca_file }}
      dependency_outputs_from_state: ${{ inputs.dependency_outputs_from_state }}
    secrets: inherit

  request:
    name: Open the apply issue
    needs: plan
    if: needs.plan.outputs.artifact != ''
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || (inputs.runner || 'ubuntu-24.04') }}
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      state: ${{ steps.request.outputs.state }}
      issue: ${{ steps.request.outputs.issue }}
    steps:
      # The issue gates the artifact by id, the way the apply gate does.
      - name: Find the artifact's id
        id: artifact
        env:
          NAME: ${{ needs.plan.outputs.artifact }}
        run: |
          set -euo pipefail
          id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${NAME}" --jq '.artifacts[0].id // empty')"
          if [ -z "${id}" ]; then
            echo "::error title=No artifact::${NAME} was not uploaded by this run"
            exit 1
          fi
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      - name: Download the plans' metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          path: ${{ runner.temp }}/terragrunt-plans

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: inputs.config_file != ''
        with:
          ref: ${{ inputs.ref }}

      # The apply-mode profiles: a unit they skip gets no approval command. → docs/terragrunt-apply.md#units-ci-does-not-apply
      - name: Read the apply profiles
        id: config
        if: inputs.config_file != ''
        uses: naviteq/github-actions/.github/actions/terragrunt-config@efd0c711d87cc906bb5adc9e14ac293d29f83b1a
        with:
          config_file: ${{ inputs.config_file }}
          mode: apply

      - name: List the planned units
        id: planned
        if: steps.config.outcome == 'success'
        env:
          METADATA: ${{ runner.temp }}/terragrunt-plans/metadata.json
        run: |
          set -euo pipefail
          {
            echo "units<<GATE_UNITS_EOF"
            jq -r '.units[] | select(.deleted | not) | .unit' "${METADATA}"
            echo "GATE_UNITS_EOF"
          } >> "$GITHUB_OUTPUT"

      # An unmatched unit fails the apply itself; the issue still opens.
      - name: Find the units CI does not apply
        id: apply-profiles
        if: steps.config.outcome == 'success'
        continue-on-error: true
        uses: naviteq/github-actions/.github/actions/terragrunt-plan-profiles@efd0c711d87cc906bb5adc9e14ac293d29f83b1a
        with:
          profiles: ${{ steps.config.outputs.profiles }}
          units: ${{ steps.planned.outputs.units }}

      - name: Open the issue that gates the apply
        id: request
        uses: naviteq/github-actions/.github/actions/terragrunt-apply-gate@efd0c711d87cc906bb5adc9e14ac293d29f83b1a
        with:
          command: request
          action: apply
          sha: ${{ github.sha }}
          pr: ${{ inputs.pr }}
          artifact_id: ${{ steps.artifact.outputs.id }}
          metadata: ${{ runner.temp }}/terragrunt-plans/metadata.json
          approvers: ${{ inputs.approvers || vars.TERRAGRUNT_APPLY_APPROVERS }}
          second_approver_cost: ${{ inputs.second_approver_cost || vars.TERRAGRUNT_APPLY_SECOND_APPROVER_COST }}
          label: ${{ inputs.label }}
          apply_skipped: ${{ steps.apply-profiles.outputs.skipped }}
