---
name: Actionlint
on:
  pull_request:
    branches: ["main"]
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner to use. Supports a single label or a JSON array of labels.
        required: false
        type: string
        default: ubuntu-24.04

permissions: {}

concurrency:
  group: actionlint-${{ github.workflow }}-${{ github.ref }}-${{ inputs.runner }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint workflows and local actions
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || (inputs.runner != '' && inputs.runner || (vars.DEFAULT_ORG_RUNNER || 'ubuntu-24.04')) }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # On PATH before raven-actions/actionlint, so it skips its unpinned pipx and sudo apt installs. → see docs/actionlint.md
      - name: Ensure pyflakes
        uses: naviteq/github-actions/.github/actions/ensure-tool@dc56662f11287f94441e59a4323aa0b640552bfa
        with:
          tool: pyflakes
          version: 4.0.3

      - name: Ensure shellcheck
        uses: naviteq/github-actions/.github/actions/ensure-tool@dc56662f11287f94441e59a4323aa0b640552bfa
        with:
          tool: shellcheck
          version: 0.11.0

      - name: Run actionlint with reviewdog
        uses: reviewdog/action-actionlint@48e36f54d8da326b83ab061aee2cc5e01b5ca46f # v1.80.6
        with:
          reporter: github-pr-check
          fail_level: any
          filter_mode: nofilter
          actionlint_flags: "-config-file .github/actionlint.yaml"

      - name: Run actionlint on workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          version: 1.7.12
          matcher: true

      - name: Validate local actions
        if: ${{ always() }}
        uses: naviteq/github-actions/.github/actions/action-lint@dc56662f11287f94441e59a4323aa0b640552bfa
        with:
          actions: .github/actions/*/action.y*ml
