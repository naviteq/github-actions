---
name: Pre-commit

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner to use. Supports a single label or a JSON array of labels.
        required: false
        type: string
        default: ubuntu-24.04
      skip_hooks:
        description: >
          Comma-separated list of pre-commit hook IDs to skip.
          Passed as the SKIP environment variable to pre-commit.
          Use this to skip hooks that require tools not available on the runner
          (e.g. Docker-dependent hooks on runners without Docker).
        required: false
        type: string
        default: ""
      flags:
        description: Additional flags to pass to pre-commit.
        required: false
        type: string
        default: "--all-files"
      changed_files_only:
        description: >
          On a pull request to the default branch, replace `--all-files` in `flags` with the
          files it changes against that branch. Anything else runs `flags` as given. See docs/pre-commit.md.
        required: false
        type: boolean
        default: false
      all_files_when_changed:
        description: >
          With changed_files_only, an extended regular expression matched against every
          path the pull request changes. Any match keeps `--all-files`, as a change to
          `.pre-commit-config.yaml` always does.
        required: false
        type: string
        default: ""
      extra_pre_command:
        description: >
          Extra command to run before pre-commit, eval'd in the same shell. Keep it to
          `source path/to/script.sh` and put every $VAR and quote inside the script.
        required: false
        type: string
        default: ""
      allow_failure:
        description: Whether to allow the job to fail.
        required: false
        type: boolean
        default: false
      github_token_for_hooks:
        description: >
          Export the job's own GITHUB_TOKEN to the hooks as GH_TOKEN/GITHUB_TOKEN,
          so a hook that fetches from github.com is attributable instead of
          anonymous and rate-limited per runner IP. Opt-in, and off by default:
          on a runner whose image already configures a git credential helper,
          overriding these variables can break pre-commit's own hook-repo
          fetches. See docs/pre-commit.md.
        required: false
        type: boolean
        default: false
      pre_commit_version:
        description: >
          Exact pre-commit version to run (X.Y.Z). A runner that already has it on PATH
          uses it as is; any other runner installs it. The job fails if the version
          pre-commit reports afterwards is not this one.
        required: false
        type: string
        # renovate: datasource=pypi depName=pre-commit
        default: 4.7.0
    outputs:
      outcome:
        description: Outcome from the pre-commit job
        value: ${{ jobs.pre-commit.outputs.outcome }}
      pre_commit_source:
        description: baked when the runner already had pre_commit_version, installed when the job installed it
        value: ${{ jobs.pre-commit.outputs.pre_commit_source }}
      pre_commit_resolved:
        description: Version pre-commit reported after the decision
        value: ${{ jobs.pre-commit.outputs.pre_commit_resolved }}
      scope:
        description: changed when the run checked only the files the pull request changes, flags when it ran flags as given
        value: ${{ jobs.pre-commit.outputs.scope }}
      changed_file_count:
        description: Number of paths in the range the narrowed run checked, empty unless scope is changed
        value: ${{ jobs.pre-commit.outputs.changed_file_count }}

permissions: {}

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || (inputs.runner || 'ubuntu-24.04') }}
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.run.outcome }}
      pre_commit_source: ${{ steps.ensure.outputs.source }}
      pre_commit_resolved: ${{ steps.ensure.outputs.resolved }}
      scope: ${{ steps.scope.outputs.scope }}
      changed_file_count: ${{ steps.scope.outputs.count }}
    env:
      # Only a pull request to the default branch has that branch's tip as HEAD^1. → docs/pre-commit.md
      NARROW: ${{ inputs.changed_files_only && github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ env.NARROW == 'true' && 2 || 1 }}

      # No setup-python: a baked pre-commit runs on the image's own Python. → docs/pre-commit.md
      - name: Ensure pre-commit ${{ inputs.pre_commit_version }}
        id: ensure
        uses: naviteq/github-actions/.github/actions/ensure-tool@2e6ec34c53e99c90cc9cd53c5178ee6222e8166f
        with:
          tool: pre-commit
          version: ${{ inputs.pre_commit_version }}

      - name: Report pre-commit source
        id: report
        shell: bash
        env:
          REQUESTED: ${{ inputs.pre_commit_version }}
          SOURCE: ${{ steps.ensure.outputs.source }}
          RESOLVED: ${{ steps.ensure.outputs.resolved }}
          TOOL_PATH: ${{ steps.ensure.outputs.path }}
        run: |
          set -euo pipefail
          if [ "${RESOLVED}" != "${REQUESTED#v}" ]; then
            echo "::error title=pre-commit::requested ${REQUESTED#v}, resolved ${RESOLVED:-nothing} (${SOURCE})"
            exit 1
          fi
          interpreter="$(dirname "$(readlink -f "${TOOL_PATH}")")/python"
          python_version="unknown"
          if [ -x "${interpreter}" ]; then
            python_version="$("${interpreter}" -c 'import platform; print(platform.python_version())')"
          fi
          case "${SOURCE}" in
            baked) path_ran="baked into the runner image: no setup-python, no pip install" ;;
            *) path_ran="installed by ensure-tool" ;;
          esac
          echo "python=${python_version}" >> "${GITHUB_OUTPUT}"
          echo "pre-commit ${RESOLVED} on Python ${python_version}, ${path_ran}." | tee -a "${GITHUB_STEP_SUMMARY}"

      # The interpreter is in the key: hook venvs restored onto another Python are rebuilt but never re-saved.
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-py${{ steps.report.outputs.python }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Select the files to check
        id: scope
        shell: bash
        env:
          FLAGS: ${{ inputs.flags }}
          ALL_FILES_WHEN_CHANGED: ${{ inputs.all_files_when_changed }}
        run: |
          set -euo pipefail
          scope=flags
          count=""
          if [ "${NARROW}" = "true" ] && [ -z "$(git rev-parse -q --verify HEAD^2 || true)" ]; then
            echo "::warning title=pre-commit::HEAD is not the pull request's merge commit, so HEAD^1 is not the default branch; flags run as given."
            NARROW=false
          fi
          if [ "${NARROW}" = "true" ] && [[ " ${FLAGS} " == *" --all-files "* ]]; then
            from=HEAD^1
            to=HEAD
            changed="$(git diff --name-only --no-renames "${from}" "${to}")"
            patterns=(-e '^\.pre-commit-config\.yaml$')
            if [ -n "${ALL_FILES_WHEN_CHANGED}" ]; then
              patterns+=(-e "${ALL_FILES_WHEN_CHANGED}")
            fi
            trigger="$(grep -E -m1 "${patterns[@]}" <<<"${changed}")" || [ $? -eq 1 ]
            if [ -n "${trigger}" ]; then
              echo "${trigger} changed, so every file is checked." | tee -a "${GITHUB_STEP_SUMMARY}"
            else
              FLAGS="${FLAGS/--all-files/--from-ref ${from} --to-ref ${to}}"
              scope=changed
              count="$(grep -c . <<<"${changed}" || true)"
              echo "Checking only the ${count} file(s) this pull request changes." | tee -a "${GITHUB_STEP_SUMMARY}"
            fi
          fi
          {
            echo "scope=${scope}"
            echo "count=${count}"
            echo "flags=${FLAGS}"
          } >> "${GITHUB_OUTPUT}"

      - name: Run pre-commit
        continue-on-error: ${{ inputs.allow_failure }}
        id: run
        env:
          SKIP: ${{ inputs.skip_hooks }}
          # Opt-in only: an anonymous hook is rate-limited per runner, and
          # setting these unasked broke a fetch. → docs/pre-commit.md
          GH_TOKEN: ${{ inputs.github_token_for_hooks && github.token || '' }}
          GITHUB_TOKEN: ${{ inputs.github_token_for_hooks && github.token || '' }}
        run: |
          set -e
          eval "${{ inputs.extra_pre_command }}"
          pre-commit run ${{ steps.scope.outputs.flags }}
