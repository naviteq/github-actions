---
name: Docker build
on:
  workflow_call:
    outputs:
      tag-names:
        description: JSON-encoded array of generated docker tag names without the image base. Consume with fromJSON().
        value: ${{ jobs.build.outputs.tag-names }}
      tags:
        description: JSON-encoded array of generated image tags (registry/image:tag). Consume with fromJSON().
        value: ${{ jobs.build.outputs.tags }}
      image-ref:
        description: Primary image reference in the form repo/image:<primary_tag>
        value: ${{ jobs.build.outputs.image-ref }}
      digest:
        description: Built image digest; with platform_runners, the digest of the merged multi-platform index
        value: ${{ jobs.merge.outputs.digest || jobs.build.outputs.digest }}
      imageid:
        description: Built image ID; empty with platform_runners
        value: ${{ jobs.build.outputs.imageid }}
      metadata:
        description: Build metadata JSON; empty with platform_runners
        value: ${{ jobs.build.outputs.metadata }}
      scan_artifact_name:
        description: Security scan artifact name
        value: ${{ jobs.build.outputs.scan_artifact_name }}
      sbom_artifact_name:
        description: SBOM artifact name
        value: ${{ jobs.build.outputs.sbom_artifact_name }}
    inputs:
      docker_context:
        description: Docker build context
        type: string
        required: false
        default: "."
      docker_push:
        description: Do we should push the image or not
        type: boolean
        required: false
        default: true
      registry:
        description: Registry URL
        type: string
        required: false
        default: ""
      username:
        description: Registry Username
        type: string
        required: false
        default: ""
      image:
        description: Image name
        type: string
        required: false
      aws_region:
        description: AWS Region
        type: string
        required: false
      docker_platforms:
        description: Target Docker platforms (e.g. linux/amd64,linux/arm64 or linux/arm/v7). Ignored when platform_runners is set.
        type: string
        required: false
        default: "linux/amd64,linux/arm64"
      runner:
        description: >-
          GitHub Actions runner to use for the build job. Supports a single label or a JSON array of labels.
          With platform_runners set, it runs the merge job only.
        type: string
        required: false
        default: "ubuntu-22.04"
      platform_runners:
        description: >-
          JSON array of {"platform", "runner"} objects. Builds each platform natively on its own runner,
          pushes it by digest and merges the digests into one multi-platform index. Empty keeps the single-job build.
        type: string
        required: false
        default: ""
      dockerfile:
        description: Path to Dockerfile (relative to context). Leave empty to use default {context}/Dockerfile
        type: string
        required: false
        default: ""
      build_args:
        description: Docker build arguments (multiline KEY=value format)
        type: string
        required: false
        default: ""
      tag_flavor_suffix:
        description: Tag flavor suffix applied to all generated tags (e.g. -arm64, -debug)
        type: string
        required: false
        default: ""
      tag_flavor_prefix:
        description: Tag flavor prefix applied to all generated tags
        type: string
        required: false
        default: ""
      version_tag_v_prefix:
        description: Whether semver image tags should use a leading v prefix
        type: boolean
        required: false
        default: false
      custom_tags:
        description: Custom tags (newline separated)
        type: string
        required: false
        default: ""
      immutable_tags:
        description: >-
          Emit only tags that are pushed once — sha-<short> on branch pushes, the full
          semver on tag pushes — for registries with tag immutability enabled.
        type: boolean
        required: false
        default: false
      security_scan_enabled:
        description: Enable container vulnerability scan
        type: boolean
        required: false
        default: false
      security_scan_severity:
        description: Comma-separated severities to scan and display (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)
        type: string
        required: false
        default: "CRITICAL"
      security_scan_exit_code:
        description: Exit code used by vulnerability scanner (use 0 to never fail)
        type: string
        required: false
        default: "1"
      security_scan_trivyignore:
        description:
        type: string
        required: false
        default: ""
      sbom_enabled:
        description: Enable SBOM generation
        type: boolean
        required: false
        default: false
      sbom_attestation:
        description: >
          Attach an in-toto SBOM attestation to the pushed image. Off by
          default: BuildKit pulls the syft generator from Docker Hub on every
          build, and `sbom_enabled` already publishes a CycloneDX SBOM.
        type: boolean
        required: false
        default: false
      slack_notify_on_success:
        description: Send Slack notification on successful build
        type: boolean
        required: false
        default: false
      cache_backend:
        description: >
          Cache backend: "gha" (default, GitHub Actions cache) or "registry"
          (stores cache manifest in the container registry — recommended for
          ECR-hosted images to avoid the 10 GB GHA cache limit).
        type: string
        required: false
        default: "gha"
      default_branch:
        description: >
          Default branch name used for cache fallback. Feature branches pull
          cache from this branch on first run.
        type: string
        required: false
        default: "main"
      report_retention_days:
        description: Retention period for the Trivy report and SBOM artifacts, in days
        type: number
        required: false
        default: 14
    secrets:
      token:
        description: Registry Token
        required: false
      aws_iam_role:
        description: AWS IAM Role to assume
        required: false
      build_secrets:
        description: Build secrets (multiline KEY=value format)
        required: false
      slack_webhook:
        description: Slack incoming webhook URL
        required: false

permissions: {}

jobs:
  # One leg per platform_runners entry, or a single leg building every platform.
  # → see docs/docker-build.md#native-per-platform-builds
  build:
    name: ${{ matrix.platform != '' && format('Docker build {0}', matrix.platform) || 'Docker build and push to registry' }}
    runs-on: ${{ matrix.runner != '' && matrix.runner || (startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || (inputs.runner || 'ubuntu-24.04')) }}
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.platform_runners != '' && inputs.platform_runners || '[{"platform":"","runner":""}]') }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      # Per-platform legs push by digest only; the merge job publishes tags, scans and reports.
      DOCKER_BUILD_PUBLISHES: ${{ inputs.platform_runners == '' }}
    outputs:
      tag-names: ${{ steps.tag_outputs.outputs.tag-names }}
      tags: ${{ steps.tag_outputs.outputs.tags }}
      image-ref: ${{ steps.image_ref.outputs.image-ref }}
      digest: ${{ inputs.platform_runners == '' && steps.build_push.outputs.digest || '' }}
      imageid: ${{ inputs.platform_runners == '' && steps.build_push.outputs.imageid || '' }}
      metadata: ${{ inputs.platform_runners == '' && steps.build_push.outputs.metadata || '' }}
      digest-artifact-prefix: ${{ steps.platform_digest.outputs.artifact-prefix }}
      scan_artifact_name: docker-build-trivy-scan-report
      sbom_artifact_name: docker-build-cyclonedx-sbom
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - &setup_buildx
        name: Set up Docker Buildx
        # v4.3.0 is the floor: it closed the ENOENT race on ephemeral runners.
        # → https://github.com/docker/setup-buildx-action/issues/479
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Set up QEMU
        if: matrix.platform == ''
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          image: "public.ecr.aws/eks-distro-build-tooling/binfmt-misc:qemu-v9.2.2"
          platforms: "arm64,arm"
      # Auth
      ## AWS
      - &aws_credentials
        name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: inputs.aws_region != '' && (inputs.docker_push || inputs.cache_backend == 'registry')
        with:
          role-to-assume: ${{ secrets.aws_iam_role }}
          role-session-name: github-${{ github.repository_id }}-${{ github.actor_id }}
          aws-region: ${{ inputs.aws_region }}
      - &ecr_login
        name: Login to Amazon ECR
        if: inputs.aws_region != '' && (inputs.docker_push || inputs.cache_backend == 'registry')
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      ## GHCR
      - &ghcr_login
        name: Login to GitHub Container Registry
        if: inputs.docker_push && inputs.registry == 'ghcr.io' && inputs.aws_region == ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ inputs.username != '' && inputs.username || github.actor }}
          password: ${{ secrets.token }}
      ## OCIR
      - &ocir_login
        name: Login to Oracle Container Registry (OCIR)
        # → see docs/docker-build.md
        if: inputs.docker_push && endsWith(inputs.registry, 'ocir.io') && inputs.username != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.username }}
          password: ${{ secrets.token }}
      ## Other
      - &registry_login
        name: Login to registry (using username and token)
        if: inputs.docker_push && inputs.registry != '' && inputs.registry != 'ghcr.io' && !endsWith(inputs.registry, 'ocir.io') && inputs.username != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.username }}
          password: ${{ secrets.token }}
      - name: Compute cache parameters
        id: cache
        shell: bash
        env:
          # `github.ref_name` is `<n>/merge` on a PR, so every pull request
          # would claim a fresh cache tag that no later run can reuse.
          REF_NAME_RAW: ${{ github.head_ref || github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT

          echo "::group::Sanitize branch names into OCI-safe tags"
          image="${{ inputs.image != '' && inputs.image || github.repository }}"
          BACKEND="${{ inputs.cache_backend }}"
          if [[ "$BACKEND" == "registry" && "${{ inputs.immutable_tags }}" == "true" ]]; then
            echo "::error::cache_backend=registry rewrites buildcache-* tags on every run; use gha with immutable_tags" >&2
            exit 1
          fi
          default_branch="${{ inputs.default_branch }}"

          sanitize_oci_tag() {
            # OCI tag grammar: [A-Za-z0-9_][A-Za-z0-9_.-]{0,127}
            # Lowercase, replace any disallowed char with '-', cap at 128.
            printf '%s' "$1" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9_.-]/-/g' \
              | cut -c1-128
          }

          REF_NAME="$(sanitize_oci_tag "$REF_NAME_RAW")"
          DEFAULT_BRANCH_SAFE="$(sanitize_oci_tag "$default_branch")"

          # A per-platform leg gets its own cache ref, so concurrent legs never overwrite each other.
          PLATFORM_SLUG="${PLATFORM:+-$(sanitize_oci_tag "$PLATFORM")}"

          SCOPE="${REF_NAME}-${image}${PLATFORM_SLUG}"
          DEFAULT_SCOPE="${DEFAULT_BRANCH_SAFE}-${image}${PLATFORM_SLUG}"
          echo "::endgroup::"

          echo "::group::Build cache-from / cache-to for selected backend (${BACKEND})"
          if [[ "$BACKEND" == "registry" ]]; then
            if [[ -n "${{ inputs.aws_region }}" ]]; then
              REGISTRY_BASE="${{ steps.ecr.outputs.registry }}/${image}"
            else
              REGISTRY_BASE="${{ inputs.registry }}/${image}"
            fi

            CACHE_TAG="$(sanitize_oci_tag "buildcache${PLATFORM_SLUG}-${REF_NAME}")"
            DEFAULT_CACHE_TAG="$(sanitize_oci_tag "buildcache${PLATFORM_SLUG}-${DEFAULT_BRANCH_SAFE}")"

            CACHE_FROM="type=registry,ref=${REGISTRY_BASE}:${CACHE_TAG}"
            if [[ "$REF_NAME" != "$DEFAULT_BRANCH_SAFE" ]]; then
              CACHE_FROM="${CACHE_FROM}
          type=registry,ref=${REGISTRY_BASE}:${DEFAULT_CACHE_TAG}"
            fi
            # ECR only serves cache written as an OCI image manifest; without
            # these the export succeeds and every later import matches nothing.
            CACHE_TO="type=registry,ref=${REGISTRY_BASE}:${CACHE_TAG},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true"
          else
            CACHE_FROM="type=gha,scope=${SCOPE}"
            if [[ "$REF_NAME" != "$DEFAULT_BRANCH_SAFE" ]]; then
              CACHE_FROM="${CACHE_FROM}
          type=gha,scope=${DEFAULT_SCOPE}"
            fi
            CACHE_TO="type=gha,mode=max,scope=${SCOPE}"
          fi
          echo "::endgroup::"

          echo "::group::Export cache parameters to step outputs"
          {
            echo "cache-from<<CEOF"
            echo "$CACHE_FROM"
            echo "CEOF"
            echo "cache-to<<CEOF"
            echo "$CACHE_TO"
            echo "CEOF"
          } >> "$GITHUB_OUTPUT"
          echo "::endgroup::"
      - &docker_meta
        name: Prepare Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ inputs.aws_region != '' && steps.ecr.outputs.registry || inputs.registry }}/${{ inputs.image != '' && inputs.image || github.repository }}
          flavor: |
            latest=false
            prefix=${{ inputs.tag_flavor_prefix }}
            suffix=${{ inputs.tag_flavor_suffix }}
          tags: |
            # Default branch push: add branch name (e.g. main)
            type=ref,event=branch,enable=${{ !inputs.immutable_tags && github.ref_name == github.event.repository.default_branch }}
            # Primary tag: sha-<shortsha>; immutable_tags skips it on tag pushes (already pushed from the branch)
            type=sha,prefix=${{ inputs.tag_flavor_prefix }}sha-,format=short,enable=${{ !inputs.immutable_tags || github.ref_type != 'tag' }}
            # Feature branches: feature/<name> -> <name>
            type=match,pattern=^feature/(.+)$,group=1,value=${{ github.ref_name }},enable=${{ !inputs.immutable_tags && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/') }}
            # Pull requests: PR #123 -> pr-123
            type=ref,event=pr,enable=${{ !inputs.immutable_tags && github.event_name == 'pull_request' }}
            # Version tag X.Y.Z -> X.Y.Z and vX.Y.Z
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}},enable=${{ inputs.version_tag_v_prefix }}
            # Version tag X.Y.Z -> X.Y and vX.Y
            type=semver,pattern={{major}}.{{minor}},enable=${{ !inputs.immutable_tags }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ !inputs.immutable_tags && inputs.version_tag_v_prefix }}
            # Version tag X.Y.Z -> X and vX
            type=semver,pattern={{major}},enable=${{ !inputs.immutable_tags }}
            type=semver,pattern=v{{major}},enable=${{ !inputs.immutable_tags && inputs.version_tag_v_prefix }}
            # Version tag push (v*): add latest
            type=raw,value=latest,enable=${{ !inputs.immutable_tags && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
            # Scheduled workflow: nightly tag
            type=schedule,pattern=nightly,enable=${{ !inputs.immutable_tags }}
            # Scheduled workflow: UTC date tag YYYYMMDD
            type=schedule,pattern={{date 'YYYYMMDD'}},enable=${{ !inputs.immutable_tags }}
            # User-provided custom tags
            ${{ inputs.custom_tags }}
      - name: Derive tag list outputs
        id: tag_outputs
        shell: bash
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
          IMAGE_BASE: ${{ inputs.aws_region != '' && steps.ecr.outputs.registry || inputs.registry }}/${{ inputs.image != '' && inputs.image || github.repository }}
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT

          echo "::group::Parse tag list from meta JSON"
          tags_json="$(jq -c '.tags' <<<"$META_JSON")"
          if ! jq -e 'type == "array"' <<<"$tags_json" >/dev/null; then
            echo "meta json .tags is not a JSON array" >&2
            exit 1
          fi
          echo "tags=$tags_json"
          echo "::endgroup::"

          echo "::group::Derive tag-names by stripping image base prefix"
          prefix="${IMAGE_BASE}:"
          tag_names=()
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            tag_names+=("${tag#"$prefix"}")
          done < <(jq -r '.tags[]' <<<"$META_JSON")

          if (( ${#tag_names[@]} == 0 )); then
            tag_names_json="[]"
          else
            tag_names_json="$(printf '%s\n' "${tag_names[@]}" | jq -R . | jq -sc .)"
          fi
          echo "tag-names=$tag_names_json"
          echo "::endgroup::"

          echo "::group::Export JSON arrays to step outputs"
          {
            echo "tags=$tags_json"
            echo "tag-names=$tag_names_json"
          } >> "$GITHUB_OUTPUT"
          echo "::endgroup::"
      - name: Resolve primary image ref
        id: image_ref
        shell: bash
        env:
          IMAGE_BASE: ${{ inputs.aws_region != '' && steps.ecr.outputs.registry || inputs.registry }}/${{ inputs.image != '' && inputs.image || github.repository }}
          IMAGE_TAG_PREFIX: ${{ inputs.tag_flavor_prefix }}sha-
          IMAGE_TAG_SUFFIX: ${{ inputs.tag_flavor_suffix }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
          IMMUTABLE_TAGS: ${{ inputs.immutable_tags }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT
          echo "::group::Resolve sha-based primary image reference from metadata tags"
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            if [[ "$tag" == "${IMAGE_BASE}:${IMAGE_TAG_PREFIX}"*"$IMAGE_TAG_SUFFIX" ]]; then
              echo "image-ref=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done <<< "$META_TAGS"

          # Immutable mode drops sha-* on tag pushes: the commit was already pushed under it from its branch.
          if [[ "$IMMUTABLE_TAGS" == "true" && "$REF_TYPE" == "tag" ]]; then
            echo "image-ref=$(head -n1 <<< "$META_TAGS")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "failed to resolve sha-based image ref from metadata tags" >&2
          exit 1
      - name: Build and push
        id: build_push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          platforms: ${{ matrix.platform != '' && matrix.platform || inputs.docker_platforms }}
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ matrix.platform == '' && inputs.docker_push }}
          # A per-platform leg pushes an untagged manifest; the merge job tags the combined index.
          outputs: >-
            ${{ matrix.platform != '' && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push={2}',
            inputs.aws_region != '' && steps.ecr.outputs.registry || inputs.registry,
            inputs.image != '' && inputs.image || github.repository, inputs.docker_push) || '' }}
          build-args: ${{ inputs.build_args }}
          secrets: ${{ secrets.build_secrets }}
          tags: ${{ matrix.platform == '' && steps.meta.outputs.tags || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          attests: |
            type=provenance,mode=max
            ${{ inputs.sbom_attestation && 'type=sbom' || '' }}
          cache-from: ${{ steps.cache.outputs.cache-from }}
          cache-to: ${{ steps.cache.outputs.cache-to }}
      - name: Record platform digest
        id: platform_digest
        if: matrix.platform != '' && inputs.docker_push
        shell: bash
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
          DIGESTS_DIR: ${{ runner.temp }}/digests
          IMAGE: ${{ inputs.image != '' && inputs.image || github.repository }}
          PLATFORM: ${{ matrix.platform }}
          TAG_AFFIXES: ${{ inputs.tag_flavor_prefix }}${{ inputs.tag_flavor_suffix }}
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT

          echo "::group::Name the digest artifact after the image, so callers' build matrices do not collide"
          artifact_safe() { printf '%s' "$1" | sed 's/[^A-Za-z0-9._-]/-/g'; }
          prefix="docker-build-digests-$(artifact_safe "${IMAGE}${TAG_AFFIXES}")__"
          echo "artifact-prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "artifact=${prefix}$(artifact_safe "$PLATFORM")" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

          echo "::group::Record ${PLATFORM} -> ${DIGEST}"
          if [[ "$DIGEST" != sha256:* ]]; then
            echo "::error::build-push-action returned no digest for ${PLATFORM}" >&2
            exit 1
          fi
          mkdir -p "$DIGESTS_DIR"
          touch "${DIGESTS_DIR}/${DIGEST#sha256:}"
          echo "::endgroup::"
      - name: Upload platform digest
        if: matrix.platform != '' && inputs.docker_push
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.platform_digest.outputs.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          # A re-run of a failed leg uploads under the name its first attempt already used.
          overwrite: true
      - &trivy_scan
        name: Run Trivy vulnerability scanner
        id: security_scan
        if: ${{ env.DOCKER_BUILD_PUBLISHES == 'true' && inputs.security_scan_enabled && inputs.docker_push }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_EXIT_ON_EOL: "1"
        with:
          image-ref: "${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          hide-progress: true
          format: "table"
          output: "scan-report.txt"
          exit-code: "${{ inputs.security_scan_exit_code }}"
          vuln-type: "os,library"
          severity: "${{ inputs.security_scan_severity }}"
          trivyignores: "${{ inputs.security_scan_trivyignore }}"
      - &sbom
        name: Generate SBOM (CycloneDX)
        if: ${{ always() && env.DOCKER_BUILD_PUBLISHES == 'true' && inputs.sbom_enabled && inputs.docker_push }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          hide-progress: true
          format: "cyclonedx"
          output: "sbom.json"
          exit-code: "0"
      - &trivy_summary
        name: Publish Trivy Output to Summary
        if: ${{ always() && env.DOCKER_BUILD_PUBLISHES == 'true' && inputs.security_scan_enabled && inputs.docker_push && hashFiles('scan-report.txt') != '' }}
        run: |
          set -euo pipefail
          echo "::group::Append Trivy scan report to step summary"
          if [[ -s scan-report.txt ]]; then
            {
              echo "### Security Output"
              echo "<details><summary>Click to expand</summary>"
              echo ""
              echo '```terraform'
              cat scan-report.txt
              echo '```'
              echo "</details>"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          echo "::endgroup::"
      - &upload_scan_report
        name: Upload scan report artifact
        if: ${{ always() && env.DOCKER_BUILD_PUBLISHES == 'true' && inputs.security_scan_enabled && inputs.docker_push && hashFiles('scan-report.txt') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-build-trivy-scan-report
          path: scan-report.txt
          retention-days: ${{ inputs.report_retention_days }}
      - &upload_sbom
        name: Upload SBOM artifact
        if: ${{ always() && env.DOCKER_BUILD_PUBLISHES == 'true' && inputs.sbom_enabled && inputs.docker_push && hashFiles('sbom.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-build-cyclonedx-sbom
          path: sbom.json
          retention-days: ${{ inputs.report_retention_days }}
      - &check_slack_webhook
        name: Check Slack webhook
        id: check_slack_webhook
        if: ${{ always() }}
        shell: bash
        env:
          slack_webhook: ${{ secrets.slack_webhook }}
        run: |
          set -euo pipefail
          echo "::group::Detect whether a Slack webhook secret is configured"
          if [[ -n "${slack_webhook}" ]]; then
            echo true
            echo "has_webhook=true" >> "${GITHUB_OUTPUT}"
          else
            echo false
            echo "has_webhook=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "::endgroup::"
      - &slack_notify
        name: Send Slack notification
        if: >-
          ${{ always() && steps.check_slack_webhook.outputs.has_webhook == 'true'
          && (job.status != 'success' || (inputs.slack_notify_on_success && env.DOCKER_BUILD_PUBLISHES == 'true')) }}
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4
        with:
          webhook: ${{ secrets.slack_webhook }}
          webhook-type: incoming-webhook
          payload: |
            text: "Docker build ${{ job.status }}: ${{ github.repository }}"
            attachments:
              - color: "${{ job.status == 'success' && '#2eb886' || (job.status == 'cancelled' && '#9ca3af' || '#e01e5a') }}"
                blocks:
                  - type: section
                    text:
                      type: mrkdwn
                      text: "*Docker build ${{ job.status }}*"
                  - type: section
                    fields:
                      - type: mrkdwn
                        text: "*Repository:*\n${{ github.repository }}"
                      - type: mrkdwn
                        text: "*Ref:*\n${{ github.ref_type }}: ${{ github.ref_name }}"
                      - type: mrkdwn
                        text: "*Image:*\n${{ inputs.image != '' && inputs.image || github.repository }}"
                      - type: mrkdwn
                        text: "*Run:*\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  merge:
    name: Merge platform images and push tags
    needs: build
    if: inputs.platform_runners != '' && inputs.docker_push
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || (inputs.runner || 'ubuntu-24.04') }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      DOCKER_BUILD_PUBLISHES: "true"
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - *checkout
      - *setup_buildx
      - *aws_credentials
      - *ecr_login
      - *ghcr_login
      - *ocir_login
      - *registry_login
      - *docker_meta
      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ needs.build.outputs.digest-artifact-prefix }}*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Create the multi-platform index
        id: index
        shell: bash
        env:
          DIGESTS_DIR: ${{ runner.temp }}/digests
          IMAGE_BASE: ${{ inputs.aws_region != '' && steps.ecr.outputs.registry || inputs.registry }}/${{ inputs.image != '' && inputs.image || github.repository }}
          PLATFORM_RUNNERS: ${{ inputs.platform_runners }}
          TAGS_JSON: ${{ needs.build.outputs.tags }}
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT

          echo "::group::Collect one digest per platform"
          sources=()
          for f in "$DIGESTS_DIR"/*; do
            if [[ -f "$f" ]]; then
              sources+=("${IMAGE_BASE}@sha256:$(basename "$f")")
            fi
          done
          expected="$(jq 'length' <<<"$PLATFORM_RUNNERS")"
          printf '%s\n' "${sources[@]}"
          if (( ${#sources[@]} != expected )); then
            echo "::error::expected ${expected} platform digests, found ${#sources[@]}" >&2
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Push the index under every generated tag"
          mapfile -t tags < <(jq -r '.[]' <<<"$TAGS_JSON")
          if (( ${#tags[@]} == 0 )); then
            echo "::error::docker/metadata-action generated no tags to publish" >&2
            exit 1
          fi
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          echo "::endgroup::"

          echo "::group::Verify ${tags[0]} lists every platform"
          manifest="$(docker buildx imagetools inspect "${tags[0]}" --format '{{json .Manifest}}')"
          jq -r '.manifests[] | "\(.platform.os)/\(.platform.architecture)\(if .platform.variant then "/" + .platform.variant else "" end)  \(.digest)"' <<<"$manifest"
          while IFS= read -r platform; do
            if ! jq -e --arg p "$platform" \
              '[.manifests[].platform | "\(.os)/\(.architecture)\(if .variant then "/" + .variant else "" end)"] | index($p)' \
              <<<"$manifest" >/dev/null; then
              echo "::error::${tags[0]} is missing ${platform}" >&2
              exit 1
            fi
          done < <(jq -r '.[].platform' <<<"$PLATFORM_RUNNERS")
          echo "digest=$(jq -r '.digest' <<<"$manifest")" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"
      - *trivy_scan
      - *sbom
      - *trivy_summary
      - *upload_scan_report
      - *upload_sbom
      - *check_slack_webhook
      - *slack_notify
