---
# The pull-request plan for a Terragrunt repository: the changed units and every unit
# that depends on them, planned and counted, with the plans kept encrypted. → docs/terragrunt-plan.md
name: Terragrunt plan

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner to use. Supports a single label or a JSON array of labels.
        required: false
        type: string
        default: ubuntu-24.04
      working_directory:
        description: Directory the units live under, relative to the repository root
        required: false
        type: string
        default: "."
      engine:
        description: Engine Terragrunt drives, tofu or terraform
        required: false
        type: string
        default: tofu
      terragrunt_version:
        description: Terragrunt version; read from the repository's .terragrunt-version when empty
        required: false
        type: string
        default: ""
      opentofu_version:
        description: OpenTofu version; read from the repository's .opentofu-version when empty
        required: false
        type: string
        default: ""
      terraform_version:
        description: Terraform version for engine terraform; read from the repository's .terraform-version when empty
        required: false
        type: string
        default: ""
      filter:
        description: Terragrunt --filter expression selecting the units to plan, or several, one per line, for their union. Exclusive with filter_affected
        required: false
        type: string
        default: ""
      destroy:
        description: Plan the destruction of the units filter selects, for terragrunt-destroy; needs filter, not filter_affected
        required: false
        type: boolean
        default: false
      ref:
        description: Branch or full commit SHA to check out and plan (a short SHA is read as a branch); empty for the commit that triggered the run
        required: false
        type: string
        default: ""
      filter_affected:
        description: Plan the units changed against the pull request's base branch
        required: false
        type: boolean
        default: true
      with_dependents:
        description: With filter_affected, also plan every unit that depends on a changed one
        required: false
        type: boolean
        default: true
      parallelism:
        description: How many units Terragrunt plans at once
        required: false
        type: number
        default: 4
      github_environment:
        description: GitHub Environment the job runs in, for a role whose trust policy matches on it; empty for none
        required: false
        type: string
        default: ""
      aws_region:
        description: Assume the aws_iam_role secret in this region; the default for a profile that names no region
        required: false
        type: string
        default: ""
      profiles:
        description: YAML list of credential profiles (name, paths, aws_role, aws_region, env, skip), one plan job each; empty plans everything under aws_iam_role
        required: false
        type: string
        default: ""
      env_vars:
        description: Non-secret KEY=VALUE lines exported before planning
        required: false
        type: string
        default: ""
      plan_recipient:
        description: age public key the plans are encrypted to before upload; empty uploads nothing
        required: false
        type: string
        default: ""
      artifact_name:
        description: Name of the encrypted-plan artifact; defaults to terragrunt-plan-pr<number>-<head sha> on a pull request, terragrunt-destroy-<run id> for destroy, terragrunt-plan-<sha> otherwise
        required: false
        type: string
        default: ""
      artifact_retention_days:
        description: How long the encrypted plans are kept
        required: false
        type: number
        default: 14
      pr_comment:
        description: On a pull request, keep one comment on it with the counts and the changed resource addresses; needs pull-requests write
        required: false
        type: boolean
        default: true
      slack_notify:
        description: Post the outcome and counts per unit to Slack through the slack_webhook secret; never on a fork's pull request
        required: false
        type: boolean
        default: false
      diff_mask:
        description: Attribute name globs whose values never show in the published diffs, comma-separated; empty uses the default list
        required: false
        type: string
        default: ""
      diff_secret_units:
        description: Unit path globs whose published diffs show addresses only, comma-separated
        required: false
        type: string
        default: ""
      cost_estimate:
        description: Estimate each unit's monthly cost with Infracost when the infracost_api_key secret is set
        required: false
        type: boolean
        default: true
      report_no_changes:
        description: Also comment and post to Slack when nothing changes and nothing failed; by default such a run is silent
        required: false
        type: boolean
        default: false
      provider_cache:
        description: Share providers between units through Terragrunt's provider cache, saved on the default branch
        required: false
        type: boolean
        default: true
      provider_cache_registries:
        description: Extra provider registry hostnames to cache, comma-separated, besides the two public ones
        required: false
        type: string
        default: ""
      dependency_outputs_from_state:
        description: Read the outputs of a dependency outside the run straight from its S3 state, without init; turn off for OpenTofu state encryption
        required: false
        type: boolean
        default: true
    secrets:
      naviteq_github_app_id:
        description: GitHub App id; with the key, mints a read-only token so private git sources resolve
        required: false
      naviteq_github_client_id:
        description: GitHub App client ID. Preferred over naviteq_github_app_id, which is the deprecated fallback.
        required: false
      naviteq_github_app_key:
        description: Private key of that GitHub App
        required: false
      runestra_client_id:
        description: Runestra registry client id, exchanged for a registry token
        required: false
      runestra_client_secret:
        description: Runestra registry client secret
        required: false
      aws_iam_role:
        description: AWS role assumed through OIDC when aws_region is set; selects the units, and plans those of a profile with no aws_role
        required: false
      terragrunt_extra_env:
        description: KEY=VALUE lines exported with masked values, e.g. TF_TOKEN_<host>; with profiles, a plan job gets only the keys its profile lists
        required: false
      slack_webhook:
        description: Slack incoming webhook URL, for slack_notify
        required: false
      infracost_api_key:
        description: Infracost API key for cost_estimate; without it no estimate is made and nothing fails
        required: false
    outputs:
      units:
        description: The units planned, in run order, one per line
        value: ${{ jobs.select.outputs.units }}
      deleted:
        description: Units the change deletes, planned for destruction, one per line
        value: ${{ jobs.select.outputs.deleted }}
      skipped:
        description: Units a skip profile left out, one "unit<TAB>profile<TAB>reason" line each
        value: ${{ jobs.select.outputs.skipped }}
      changes:
        description: JSON list of per-unit counts (unit, profile, add, change, replace, destroy, deleted)
        value: ${{ jobs.result.outputs.changes }}
      has_changes:
        description: true when any unit would change anything
        value: ${{ jobs.result.outputs.has_changes }}
      artifact:
        description: Name of the uploaded encrypted-plan artifact; empty when nothing was uploaded
        value: ${{ jobs.result.outputs.artifact }}

permissions: {}

jobs:
  select:
    name: Select
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || (inputs.runner || 'ubuntu-24.04') }}
    # The name lands in the OIDC subject, which a role's trust policy may match on.
    environment: ${{ inputs.github_environment }}
    permissions:
      contents: read
      id-token: write
    env:
      HAS_GITHUB_APP: ${{ secrets.naviteq_github_client_id != '' || secrets.naviteq_github_app_id != '' }}
      HAS_REGISTRY_CLIENT: ${{ secrets.runestra_client_id != '' }}
      # CAS resolves git refs over SSH and never sees the insteadOf rewrite. → docs/validate-oke.md
      TG_NO_CAS: "1"
      WARM_CACHE: >-
        ${{ inputs.provider_cache && github.event_name == 'push'
        && github.ref_name == github.event.repository.default_branch }}
    outputs:
      units: ${{ steps.units.outputs.units }}
      deleted: ${{ steps.units.outputs.deleted }}
      legs: ${{ steps.profiles.outputs.legs }}
      skipped: ${{ steps.profiles.outputs.skipped }}
      artifact: ${{ steps.artifact.outputs.name }}
      tree: ${{ steps.tree.outputs.tree }}
      commit: ${{ steps.tree.outputs.commit }}
    steps:
      - name: Reject contradictory inputs
        if: inputs.filter_affected && inputs.filter != ''
        run: |
          echo "::error title=Contradictory inputs::filter and filter_affected are both set; Terragrunt would union them. Pick one."
          exit 1

      # A destroy names what it removes; a git range or an empty filter would pick for it.
      - name: Require an explicit filter for a destroy
        if: inputs.destroy && (inputs.filter_affected || inputs.filter == '')
        run: |
          echo "::error title=Destroy needs a filter::set filter to the units to destroy and filter_affected to false."
          exit 1

      - name: Name the artifacts
        id: artifact
        env:
          # The apply finds a merged PR's plans by this name. → docs/terragrunt-plan.md
          NAME: >-
            ${{ inputs.artifact_name || (inputs.destroy && format('terragrunt-destroy-{0}', github.run_id))
            || (github.event_name == 'pull_request'
            && format('terragrunt-plan-pr{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha)
            || format('terragrunt-plan-{0}', github.sha)) }}
        run: echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: ${{ inputs.filter_affected && '0' || '1' }}

      # The apply refuses a plan whose code differs from what was merged.
      - name: Record the tree that was planned
        id: tree
        env:
          SCOPE: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          scope="${SCOPE#./}"
          scope="${scope%/}"
          if [ -z "${scope}" ] || [ "${scope}" = "." ]; then ref="HEAD^{tree}"; else ref="HEAD:${scope}"; fi
          echo "tree=$(git rev-parse "${ref}")" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate a GitHub App token for the private git sources
        id: app-token
        if: env.HAS_GITHUB_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.naviteq_github_client_id || secrets.naviteq_github_app_id }}
          private-key: ${{ secrets.naviteq_github_app_key }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            infrastructure-catalog
            terraform-modules
          permission-contents: read

      - name: Rewrite git@github.com to an authenticated https remote
        if: env.HAS_GITHUB_APP == 'true'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          for form in "git@github.com:" "ssh://git@github.com/"; do
            git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "${form}"
          done

      - name: Install Terragrunt and the engine
        uses: naviteq/github-actions/.github/actions/setup-terragrunt@b4476ff2fdc4ce68c3e59e11cd35bc38e80bbaf3
        with:
          engine: ${{ inputs.engine }}
          terragrunt_version: ${{ inputs.terragrunt_version }}
          opentofu_version: ${{ inputs.opentofu_version }}
          terraform_version: ${{ inputs.terraform_version }}

      - name: Require the AWS role
        if: inputs.aws_region != ''
        env:
          AWS_IAM_ROLE: ${{ secrets.aws_iam_role }}
        run: |
          if [ -z "${AWS_IAM_ROLE}" ]; then
            echo "::error title=Empty secret::aws_region is set but the aws_iam_role secret is empty; pass it, or call with secrets: inherit."
            exit 1
          fi

      # Selection parses every unit, and get_aws_account_id() there needs some identity.
      - name: Configure AWS credentials
        if: inputs.aws_region != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.aws_iam_role }}
          role-session-name: gh-terragrunt-plan-${{ github.run_id }}
          aws-region: ${{ inputs.aws_region }}

      - name: Exchange the registry client credentials for a token
        if: env.HAS_REGISTRY_CLIENT == 'true'
        uses: naviteq/github-actions/.github/actions/registry-token@b4476ff2fdc4ce68c3e59e11cd35bc38e80bbaf3
        with:
          client_id: ${{ secrets.runestra_client_id }}
          client_secret: ${{ secrets.runestra_client_secret }}

      # Only env_vars: no unit runs here, so no provider token is needed.
      - name: Export env_vars
        env:
          PLAIN_ENV: ${{ inputs.env_vars }}
        run: |
          set -euo pipefail
          while IFS='=' read -r key value; do
            case "${key}" in "" | \#*) continue ;; esac
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done <<< "${PLAIN_ENV}"

      - name: Turn on the provider cache
        if: env.WARM_CACHE == 'true'
        env:
          EXTRA_REGISTRIES: ${{ inputs.provider_cache_registries }}
        run: |
          set -euo pipefail
          registries="registry.terraform.io,registry.opentofu.org"
          [ -z "${EXTRA_REGISTRIES}" ] || registries="${registries},${EXTRA_REGISTRIES}"
          {
            echo "TG_PROVIDER_CACHE=1"
            echo "TG_PROVIDER_CACHE_DIR=${RUNNER_TEMP}/terragrunt-providers"
            echo "TG_PROVIDER_CACHE_REGISTRY_NAMES=${registries}"
          } >> "$GITHUB_ENV"

      # Saved only on the default branch, so PRs share one entry. → terraform-modules ADR-0036
      - name: Restore the provider cache
        id: provider-cache
        if: env.WARM_CACHE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/terragrunt-providers
          key: terragrunt-providers-${{ runner.os }}-${{ runner.arch }}-${{ inputs.engine }}-${{ hashFiles(format('{0}/**/.terraform.lock.hcl', inputs.working_directory)) }}
          restore-keys: |
            terragrunt-providers-${{ runner.os }}-${{ runner.arch }}-${{ inputs.engine }}-

      - name: Generate the stacks
        working-directory: ${{ inputs.working_directory }}
        run: terragrunt stack generate --non-interactive

      - name: Select the units and show their run order
        id: units
        uses: naviteq/github-actions/.github/actions/terragrunt-select-units@b4476ff2fdc4ce68c3e59e11cd35bc38e80bbaf3
        with:
          working_directory: ${{ inputs.working_directory }}
          filter: ${{ inputs.filter }}
          filter_affected: ${{ inputs.filter_affected }}
          with_dependents: ${{ inputs.with_dependents }}
          verb: plan
          participle: planned
          queue_as: ${{ inputs.destroy && 'destroy' || 'plan' }}

      - name: Match the units to credential profiles
        id: profiles
        uses: naviteq/github-actions/.github/actions/terragrunt-plan-profiles@b4476ff2fdc4ce68c3e59e11cd35bc38e80bbaf3
        with:
          profiles: ${{ inputs.profiles }}
          units: ${{ steps.units.outputs.units }}
          deleted: ${{ steps.units.outputs.deleted }}
          aws_region: ${{ inputs.aws_region }}

      # From the lock files, not `run --all init`: that resolves dependency outputs,
      # which need state this job cannot read. → docs/terragrunt-plan.md
      - name: Warm the provider cache
        if: env.WARM_CACHE == 'true' && steps.provider-cache.outputs.cache-hit != 'true'
        uses: naviteq/github-actions/.github/actions/terragrunt-warm-providers@b4476ff2fdc4ce68c3e59e11cd35bc38e80bbaf3
        with:
          working_directory: ${{ inputs.working_directory }}
          engine: ${{ inputs.engine }}
          cache_dir: ${{ runner.temp }}/terragrunt-providers

      - name: Save the provider cache
        if: env.WARM_CACHE == 'true' && steps.provider-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/terragrunt-providers
          key: ${{ steps.provider-cache.outputs.cache-primary-key }}

  plan:
    name: Plan ${{ matrix.leg.name }}
    needs: select
    if: needs.select.outputs.legs != '' && needs.select.outputs.legs != '[]'
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || (inputs.runner || 'ubuntu-24.04') }}
    environment: ${{ inputs.github_environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.select.outputs.legs) }}
    env:
      HAS_GITHUB_APP: ${{ secrets.naviteq_github_client_id != '' || secrets.naviteq_github_app_id != '' }}
      HAS_REGISTRY_CLIENT: ${{ secrets.runestra_client_id != '' }}
      TG_NO_CAS: "1"
      # Skips the init that breaks under the provider cache. → see docs/terragrunt-plan.md
      TG_DEPENDENCY_FETCH_OUTPUT_FROM_STATE: ${{ inputs.dependency_outputs_from_state }}
      LEG: ${{ matrix.leg.name }}
      ARTIFACT: ${{ needs.select.outputs.artifact }}
      HAS_INFRACOST: ${{ secrets.infracost_api_key != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.select.outputs.commit }}
          # Deleted units are planned through the git range, which needs the base branch.
          fetch-depth: ${{ matrix.leg.deleted != '' && '0' || '1' }}

      - name: Generate a GitHub App token for the private git sources
        id: app-token
        if: env.HAS_GITHUB_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.naviteq_github_client_id || secrets.naviteq_github_app_id }}
          private-key: ${{ secrets.naviteq_github_app_key }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            infrastructure-catalog
            terraform-modules
          permission-contents: read

      - name: Rewrite git@github.com to an authenticated https remote
        if: env.HAS_GITHUB_APP == 'true'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          for form in "git@github.com:" "ssh://git@github.com/"; do
            git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "${form}"
          done

      - name: Install Terragrunt and the engine
        uses: naviteq/github-actions/.github/actions/setup-terragrunt@b4476ff2fdc4ce68c3e59e11cd35bc38e80bbaf3
        with:
          engine: ${{ inputs.engine }}
          terragrunt_version: ${{ inputs.terragrunt_version }}
          opentofu_version: ${{ inputs.opentofu_version }}
          terraform_version: ${{ inputs.terraform_version }}

      - name: Require the profile's AWS role
        if: matrix.leg.aws_region != ''
        env:
          AWS_IAM_ROLE: ${{ matrix.leg.aws_role || secrets.aws_iam_role }}
        run: |
          if [ -z "${AWS_IAM_ROLE}" ]; then
            echo "::error title=No AWS role::profile ${LEG} names no aws_role and the aws_iam_role secret is empty."
            exit 1
          fi

      - name: Configure AWS credentials
        if: matrix.leg.aws_region != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ matrix.leg.aws_role || secrets.aws_iam_role }}
          role-session-name: gh-terragrunt-plan-${{ github.run_id }}-${{ matrix.leg.name }}
          aws-region: ${{ matrix.leg.aws_region }}

      - name: Exchange the registry client credentials for a token
        if: env.HAS_REGISTRY_CLIENT == 'true'
        uses: naviteq/github-actions/.github/actions/registry-token@b4476ff2fdc4ce68c3e59e11cd35bc38e80bbaf3
        with:
          client_id: ${{ secrets.runestra_client_id }}
          client_secret: ${{ secrets.runestra_client_secret }}

      # A profile sees only the terragrunt_extra_env keys it lists. → docs/terragrunt-plan.md
      - name: Export env_vars and the profile's TERRAGRUNT_EXTRA_ENV keys
        env:
          PLAIN_ENV: ${{ inputs.env_vars }}
          SECRET_ENV: ${{ secrets.terragrunt_extra_env }}
          ALLOWED: ${{ join(matrix.leg.env, ' ') }}
          ENV_ALL: ${{ matrix.leg.env_all }}
        run: |
          set -euo pipefail
          echo "TERRAGRUNT_PLAN_PROFILE=${LEG}" >> "$GITHUB_ENV"
          while IFS='=' read -r key value; do
            case "${key}" in "" | \#*) continue ;; esac
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done <<< "${PLAIN_ENV}"
          found=" "
          while IFS='=' read -r key value; do
            case "${key}" in "" | \#*) continue ;; esac
            if [ "${ENV_ALL}" != "true" ] && [[ " ${ALLOWED} " != *" ${key} "* ]]; then continue; fi
            if [ -n "${value}" ]; then echo "::add-mask::${value}"; fi
            echo "${key}=${value}" >> "$GITHUB_ENV"
            # A caller whose secret is unset passes KEY= with nothing after it.
            [ -z "${value}" ] || found+="${key} "
          done <<< "${SECRET_ENV}"
          for key in ${ALLOWED}; do
            if [[ "${found}" != *" ${key} "* ]]; then
              echo "::error title=Missing secret key::profile ${LEG} lists ${key}, which terragrunt_extra_env does not carry or leaves empty."
              exit 1
            fi
          done

      - name: Turn on the provider cache
        if: inputs.provider_cache
        env:
          EXTRA_REGISTRIES: ${{ inputs.provider_cache_registries }}
        run: |
          set -euo pipefail
          registries="registry.terraform.io,registry.opentofu.org"
          [ -z "${EXTRA_REGISTRIES}" ] || registries="${registries},${EXTRA_REGISTRIES}"
          {
            echo "TG_PROVIDER_CACHE=1"
            echo "TG_PROVIDER_CACHE_DIR=${RUNNER_TEMP}/terragrunt-providers"
            echo "TG_PROVIDER_CACHE_REGISTRY_NAMES=${registries}"
          } >> "$GITHUB_ENV"

      - name: Restore the provider cache
        if: inputs.provider_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/terragrunt-providers
          key: terragrunt-providers-${{ runner.os }}-${{ runner.arch }}-${{ inputs.engine }}-${{ hashFiles(format('{0}/**/.terraform.lock.hcl', inputs.working_directory)) }}
          restore-keys: |
            terragrunt-providers-${{ runner.os }}-${{ runner.arch }}-${{ inputs.engine }}-

      - name: Generate the stacks
        working-directory: ${{ inputs.working_directory }}
        run: terragrunt stack generate --non-interactive

      # Explicit paths, not the git range: a range runs units in a temporary worktree,
      # where their plan files are lost. → docs/terragrunt-plan.md
      - name: Plan the units
        id: plan
        if: matrix.leg.units != ''
        working-directory: ${{ inputs.working_directory }}
        env:
          UNITS: ${{ matrix.leg.units }}
          PARALLELISM: ${{ inputs.parallelism }}
          DESTROY: ${{ inputs.destroy }}
        run: |
          set -euo pipefail
          args=(run --all --non-interactive --parallelism "${PARALLELISM}")
          while read -r unit; do
            [ -z "${unit}" ] || args+=(--filter "./${unit}")
          done <<< "${UNITS}"
          mode=()
          if [ "${DESTROY}" = "true" ]; then
            # The destroy queue drops prevent_destroy units; the report names them. → docs/terragrunt-destroy.md
            args+=(--report-file "${RUNNER_TEMP}/terragrunt-run-report.json" --report-format json)
            mode=(-destroy)
          fi
          terragrunt "${args[@]}" -- plan "${mode[@]}" -lock=false -input=false -out=tfplan

      - name: Name the units the destroy keeps
        id: kept
        if: inputs.destroy && steps.plan.outcome == 'success'
        run: |
          set -euo pipefail
          {
            echo "units<<KEPT_EOF"
            jq -r '.[] | select(.Result == "excluded") | .Name' "${RUNNER_TEMP}/terragrunt-run-report.json"
            echo "KEPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Plan the destruction of deleted units
        if: matrix.leg.deleted != ''
        working-directory: ${{ inputs.working_directory }}
        env:
          DELETED: ${{ matrix.leg.deleted }}
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
          SCOPE: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          prefix="${SCOPE#./}"
          prefix="${prefix%/}"
          if [ -z "${prefix}" ] || [ "${prefix}" = "." ]; then prefix=""; else prefix="${prefix}/"; fi
          args=(run --all --non-interactive --filter-allow-destroy)
          while read -r unit; do
            [ -z "${unit}" ] || args+=(--filter "[origin/${BASE}...HEAD] | ./${prefix}${unit}")
          done <<< "${DELETED}"
          terragrunt "${args[@]}" -- plan -lock=false -input=false 2>&1 | tee "${RUNNER_TEMP}/terragrunt-destroy-plan.log"

      # Also after a failed plan, so the summary shows which units planned and which did not.
      - name: Count the planned changes
        id: report
        if: ${{ !cancelled() }}
        uses: naviteq/github-actions/.github/actions/terragrunt-plan-report@b4476ff2fdc4ce68c3e59e11cd35bc38e80bbaf3
        with:
          working_directory: ${{ inputs.working_directory }}
          engine: ${{ inputs.engine }}
          units: ${{ matrix.leg.units }}
          deleted: ${{ matrix.leg.deleted }}
          destroy_log: ${{ matrix.leg.deleted != '' && format('{0}/terragrunt-destroy-plan.log', runner.temp) || '' }}
          kept: ${{ steps.kept.outputs.units }}
          mask: ${{ inputs.diff_mask }}
          secret_units: ${{ inputs.diff_secret_units }}
          resources_file: ${{ runner.temp }}/terragrunt-plan-counts/${{ matrix.leg.name }}.resources.json

      # Only price attributes leave the runner; a failed estimate never fails the plan. → docs/terragrunt-plan.md
      - name: Estimate the monthly cost
        if: >-
          success() && inputs.cost_estimate && !inputs.destroy && env.HAS_INFRACOST == 'true'
          && steps.report.outputs.plans != ''
        continue-on-error: true
        uses: naviteq/github-actions/.github/actions/terragrunt-plan-cost@b4476ff2fdc4ce68c3e59e11cd35bc38e80bbaf3
        env:
          INFRACOST_API_KEY: ${{ secrets.infracost_api_key }}
        with:
          plans: ${{ steps.report.outputs.plans }}
          engine: ${{ inputs.engine }}
          out_file: ${{ runner.temp }}/terragrunt-plan-counts/${{ matrix.leg.name }}.costs.json

      - name: Keep the counts for the result job
        if: ${{ !cancelled() && steps.report.outputs.changes != '' }}
        env:
          CHANGES: ${{ steps.report.outputs.changes }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/terragrunt-plan-counts"
          jq --arg profile "${LEG}" 'map(. + {profile: $profile})' <<< "${CHANGES}" \
            > "${RUNNER_TEMP}/terragrunt-plan-counts/${LEG}.counts.json"

      - name: Upload the counts
        if: ${{ !cancelled() && steps.report.outputs.changes != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.ARTIFACT }}-counts-${{ matrix.leg.name }}
          path: ${{ runner.temp }}/terragrunt-plan-counts
          retention-days: 1
          if-no-files-found: error

      # A pinned, checksummed release binary: a plan file carries state values in clear.
      # A destroy runs `destroy`, never a plan file, so its plans are not kept. → docs/terragrunt-destroy.md
      - name: Install age
        if: success() && inputs.plan_recipient != '' && !inputs.destroy && steps.report.outputs.plans != ''
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH}" in
            X64) arch=amd64 sum=cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 ;;
            ARM64) arch=arm64 sum=6b8dc4333c53a5a57c9e5834e3a48f92605d7154014cd07269ff3327db5d37f4 ;;
            *) echo "::error title=Unsupported architecture::${RUNNER_ARCH}"; exit 1 ;;
          esac
          archive="${RUNNER_TEMP}/age.tar.gz"
          curl -fsSL -o "${archive}" "https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-${arch}.tar.gz"
          echo "${sum}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/age" >> "$GITHUB_PATH"

      - name: Encrypt the plans
        id: encrypt
        if: success() && inputs.plan_recipient != '' && !inputs.destroy && steps.report.outputs.plans != ''
        env:
          PLANS: ${{ steps.report.outputs.plans }}
          RECIPIENT: ${{ inputs.plan_recipient }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/terragrunt-plans"
          mkdir -p "${out}"
          while IFS=$'\t' read -r unit file; do
            [ -n "${unit}" ] || continue
            name="${unit//\//__}.tfplan.age"
            age --encrypt --recipient "${RECIPIENT}" --output "${out}/${name}" "${file}"
            printf '%s\t%s\t%s\n' "${unit}" "${name}" "${LEG}" >> "${out}/manifest.${LEG}.tsv"
          done <<< "${PLANS}"

      # One artifact per job; the result job merges them into the one the apply reads.
      - name: Upload this profile's encrypted plans
        if: steps.encrypt.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.ARTIFACT }}-plans-${{ matrix.leg.name }}
          path: ${{ runner.temp }}/terragrunt-plans
          retention-days: 1
          if-no-files-found: error

  result:
    name: Result
    needs: [select, plan]
    if: ${{ !cancelled() && needs.select.result == 'success' }}
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || (inputs.runner || 'ubuntu-24.04') }}
    permissions:
      contents: read
      pull-requests: write
    env:
      ARTIFACT: ${{ needs.select.outputs.artifact }}
      HAS_SLACK_WEBHOOK: ${{ secrets.slack_webhook != '' }}
    outputs:
      changes: ${{ steps.result.outputs.changes }}
      has_changes: ${{ steps.result.outputs.has_changes }}
      artifact: ${{ steps.upload.outcome == 'success' && needs.select.outputs.artifact || '' }}
    steps:
      - name: Download the counts
        if: needs.plan.result != 'skipped'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ${{ env.ARTIFACT }}-counts-*
          path: counts
          merge-multiple: true

      - name: Download the encrypted plans
        if: inputs.plan_recipient != '' && !inputs.destroy && needs.plan.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ${{ env.ARTIFACT }}-plans-*
          path: plans
          merge-multiple: true

      # Facts the apply checks the plans against before it touches anything.
      - name: Describe this plan run
        id: context
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || needs.select.outputs.commit }}
          COMMIT: ${{ needs.select.outputs.commit }}
          TREE: ${{ needs.select.outputs.tree }}
          SCOPE: ${{ inputs.working_directory }}
          DESTROY: ${{ inputs.destroy }}
        run: |
          set -euo pipefail
          jq -cn --arg repository "${GITHUB_REPOSITORY}" --arg pr "${PR}" --arg head_sha "${HEAD_SHA}" \
            --arg commit "${COMMIT}" --arg tree "${TREE}" --arg working_directory "${SCOPE}" \
            --arg run_id "${GITHUB_RUN_ID}" --arg run_attempt "${GITHUB_RUN_ATTEMPT}" --arg artifact "${ARTIFACT}" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson destroy "${DESTROY}" \
            '{repository: $repository, pr: ($pr | if . == "" then null else tonumber end), head_sha: $head_sha,
              commit: $commit, tree: $tree, working_directory: $working_directory, plan_run_id: ($run_id | tonumber),
              plan_run_attempt: ($run_attempt | tonumber), artifact: $artifact, created_at: $created_at,
              destroy: $destroy}' \
            | sed 's/^/json=/' >> "$GITHUB_OUTPUT"

      - name: Merge the counts and hand the plans over
        id: result
        uses: naviteq/github-actions/.github/actions/terragrunt-plan-result@b4476ff2fdc4ce68c3e59e11cd35bc38e80bbaf3
        with:
          counts_dir: counts
          plans_dir: >-
            ${{ (inputs.plan_recipient != '' || inputs.destroy) && contains(fromJSON('["success", "skipped"]'), needs.plan.result)
            && 'plans' || '' }}
          units: ${{ needs.select.outputs.units }}
          skipped: ${{ needs.select.outputs.skipped }}
          context_json: ${{ steps.context.outputs.json }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          comment_file: ${{ runner.temp }}/terragrunt-plan-comment.md
          slack_file: ${{ inputs.slack_notify && format('{0}/terragrunt-plan-slack.json', runner.temp) || '' }}

      - name: Upload the encrypted plans
        id: upload
        if: steps.result.outputs.handed_over == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.ARTIFACT }}
          path: plans
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

      # Never on a fork's PR: its token cannot write, and its plan never reaches an apply.
      - name: Comment on the pull request
        if: >-
          inputs.pr_comment && !inputs.destroy && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENT_FILE: ${{ runner.temp }}/terragrunt-plan-comment.md
          MARKER: terragrunt-plan:${{ inputs.working_directory }}
          # A clean run posts nothing new, but corrects a comment an earlier push left.
          SILENT: ${{ steps.result.outputs.quiet == 'true' && !inputs.report_no_changes }}
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- ${process.env.MARKER} -->`;
            const body = `${marker}\n${fs.readFileSync(process.env.COMMENT_FILE, 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else if (process.env.SILENT !== 'true') {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # Counts and links only, never addresses or values. → docs/terragrunt-plan.md
      - name: Post the summary to Slack
        if: >-
          inputs.slack_notify && env.HAS_SLACK_WEBHOOK == 'true'
          && (steps.result.outputs.quiet != 'true' || inputs.report_no_changes)
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4
        with:
          # A rejected post fails the step visibly; continue-on-error keeps the plan green.
          errors: true
          webhook: ${{ secrets.slack_webhook }}
          webhook-type: incoming-webhook
          payload-file-path: ${{ runner.temp }}/terragrunt-plan-slack.json
