---
# Plans every unit on a schedule and keeps one [drift] <unit> issue per unit whose
# infrastructure no longer matches its code. → docs/terragrunt-drift.md
name: Terragrunt drift

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner to use. Supports a single label or a JSON array of labels.
        required: false
        type: string
        default: ubuntu-24.04
      working_directory:
        description: Directory the units live under, relative to the repository root
        required: false
        type: string
        default: "."
      engine:
        description: Engine Terragrunt drives, tofu or terraform
        required: false
        type: string
        default: tofu
      terragrunt_version:
        description: Terragrunt version; read from the repository's .terragrunt-version when empty
        required: false
        type: string
        default: ""
      opentofu_version:
        description: OpenTofu version; read from the repository's .opentofu-version when empty
        required: false
        type: string
        default: ""
      terraform_version:
        description: Terraform version for engine terraform; read from the repository's .terraform-version when empty
        required: false
        type: string
        default: ""
      filter:
        description: Terragrunt --filter expression narrowing the units checked; empty checks every unit
        required: false
        type: string
        default: ""
      parallelism:
        description: How many units Terragrunt plans at once
        required: false
        type: number
        default: 4
      github_environment:
        description: GitHub Environment the plan jobs run in, for a role whose trust policy matches on it; empty for none
        required: false
        type: string
        default: ""
      aws_region:
        description: Assume the aws_iam_role secret in this region; the default for a profile that names no region
        required: false
        type: string
        default: ""
      config_file:
        description: YAML file with env_vars and credential profiles, relative to the repository root; replaces the profiles and env_vars inputs
        required: false
        type: string
        default: ""
      profiles:
        description: YAML credential profiles, as in terragrunt-plan, naming the read-only roles
        required: false
        type: string
        default: ""
      env_vars:
        description: Non-secret KEY=VALUE lines exported before planning
        required: false
        type: string
        default: ""
      provider_cache:
        description: Restore the provider cache the default branch saved
        required: false
        type: boolean
        default: true
      provider_cache_persist:
        description: Keep the provider cache in the Actions cache between jobs; false downloads each job's providers once and shares them between its units
        required: false
        type: boolean
        default: true
      provider_cache_registries:
        description: Extra provider registry hostnames to cache, comma-separated, besides the two public ones
        required: false
        type: string
        default: ""
      provider_mirror_url:
        description: Provider network mirror for the two public registries' providers, https://<host>/v1/mirror/ for boring-registry (http:// reaches Terragrunt's provider cache only); probed first, and downloads stay direct with a warning when it does not answer
        required: false
        type: string
        default: ""
      provider_mirror_ca_file:
        description: PEM file, relative to the repository root, with the CA behind an https provider_mirror_url whose certificate the runner does not trust, e.g. a private in-cluster CA
        required: false
        type: string
        default: ""
      dependency_outputs_from_state:
        description: Read the outputs of a dependency outside the run straight from its S3 state, without init; turn off for OpenTofu state encryption
        required: false
        type: boolean
        default: true
      state_lock:
        description: Hold the state lock while planning, waiting up to lock_timeout for it, instead of planning unlocked; the role then needs write on the lock object
        required: false
        type: boolean
        default: false
      lock_timeout:
        description: With state_lock, how long a plan waits for the state lock before its unit fails, as the engine's -lock-timeout reads it
        required: false
        type: string
        default: 5m
      diff_mask:
        description: Attribute name globs whose values never show in the published diffs, comma-separated; empty uses the default list
        required: false
        type: string
        default: ""
      diff_secret_units:
        description: Unit path globs whose published diffs show addresses only, comma-separated
        required: false
        type: string
        default: ""
      label:
        description: Label of the drift issues
        required: false
        type: string
        default: terragrunt-drift
      open_issues:
        description: Open, update and close drift issues; false only reports
        required: false
        type: boolean
        default: true
    secrets:
      naviteq_github_app_id:
        description: GitHub App id; with the key, mints a read-only token so private git sources resolve
        required: false
      naviteq_github_client_id:
        description: GitHub App client ID. Preferred over naviteq_github_app_id, which is the deprecated fallback.
        required: false
      naviteq_github_app_key:
        description: Private key of that GitHub App
        required: false
      runestra_client_id:
        description: Runestra registry client id, exchanged for a registry token
        required: false
      runestra_client_secret:
        description: Runestra registry client secret
        required: false
      runestra_registry_token:
        description: Static Runestra registry token; preferred over the client id and secret, which cost an Auth0 token per job
        required: false
      aws_iam_role:
        description: AWS role assumed through OIDC when aws_region is set; read-only is enough
        required: false
      oci_oidc_domain_url:
        description: OCI Identity Domain URL, for a profile with oci_region; also the token audience
        required: false
      oci_oidc_client_id:
        description: OAuth client ID of the identity domain's Confidential Application, for a profile with oci_region
        required: false
      oci_oidc_client_secret:
        description: OAuth client secret of that application; reaches no OCI API on its own
        required: false
      oci_tenancy_ocid:
        description: OCID of the tenancy a profile with oci_region must authenticate into; a mismatch fails the job
        required: false
      oci_s3_access_key_id:
        description: Customer Secret Key ID the S3-compatible state backend signs with, for a profile with oci_region
        required: false
      oci_s3_secret_access_key:
        description: Customer Secret Key secret that goes with oci_s3_access_key_id
        required: false
      terragrunt_extra_env:
        description: KEY=VALUE lines exported with masked values; with profiles, a job gets only the keys its profile lists
        required: false
    outputs:
      drifted:
        description: Units whose plan would change something, one per line
        value: ${{ jobs.issues.outputs.drifted }}
      has_drift:
        description: true when any unit drifted
        value: ${{ jobs.issues.outputs.has_drift }}

permissions: {}

jobs:
  plan:
    uses: naviteq/github-actions/.github/workflows/terragrunt-plan.yaml@9b6fa0b506462852c27d833f3cb1e0809d4444a0
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    with:
      runner: ${{ inputs.runner }}
      working_directory: ${{ inputs.working_directory }}
      engine: ${{ inputs.engine }}
      terragrunt_version: ${{ inputs.terragrunt_version }}
      opentofu_version: ${{ inputs.opentofu_version }}
      terraform_version: ${{ inputs.terraform_version }}
      filter: ${{ inputs.filter }}
      filter_affected: false
      parallelism: ${{ inputs.parallelism }}
      github_environment: ${{ inputs.github_environment }}
      aws_region: ${{ inputs.aws_region }}
      profiles: ${{ inputs.profiles }}
      config_file: ${{ inputs.config_file }}
      env_vars: ${{ inputs.env_vars }}
      # Nothing is kept for an apply: a drift plan is a report, not a change to approve.
      plan_recipient: ""
      pr_comment: false
      artifact_name: terragrunt-drift-${{ github.run_id }}-${{ github.run_attempt }}
      provider_cache: ${{ inputs.provider_cache }}
      provider_cache_persist: ${{ inputs.provider_cache_persist }}
      provider_cache_registries: ${{ inputs.provider_cache_registries }}
      provider_mirror_url: ${{ inputs.provider_mirror_url }}
      provider_mirror_ca_file: ${{ inputs.provider_mirror_ca_file }}
      dependency_outputs_from_state: ${{ inputs.dependency_outputs_from_state }}
      state_lock: ${{ inputs.state_lock }}
      lock_timeout: ${{ inputs.lock_timeout }}
      diff_mask: ${{ inputs.diff_mask }}
      diff_secret_units: ${{ inputs.diff_secret_units }}
    secrets: inherit

  # Also after a failed plan job: units it did plan still get their issues reconciled.
  issues:
    name: Reconcile the drift issues
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.changes != '' }}
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || (inputs.runner || 'ubuntu-24.04') }}
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      drifted: ${{ steps.drift.outputs.drifted }}
      has_drift: ${{ steps.drift.outputs.has_drift }}
    steps:
      - name: Download the changed resource addresses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: terragrunt-drift-${{ github.run_id }}-${{ github.run_attempt }}-counts-*
          path: counts
          merge-multiple: true

      - name: Reconcile the drift issues
        id: drift
        uses: naviteq/github-actions/.github/actions/terragrunt-drift-issues@9b6fa0b506462852c27d833f3cb1e0809d4444a0
        with:
          changes: ${{ needs.plan.outputs.changes }}
          counts_dir: counts
          label: ${{ inputs.label }}
          open_issues: ${{ inputs.open_issues }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
