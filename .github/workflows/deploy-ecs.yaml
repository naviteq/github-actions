---
name: Deploy services to ECS
on:
  workflow_call:
    inputs:
      image:
        description: Full image reference to deploy (registry/image:tag).
        type: string
        required: true
      aws_region:
        description: AWS Region
        type: string
        required: false
      runner:
        description: GitHub Actions runner to use for the deploy job. Supports a single label or a JSON array of labels.
        type: string
        required: false
        default: "ubuntu-24.04"
      ecs_cluster:
        description: ECS cluster name
        type: string
        required: true
      ecs_service:
        description: ECS service name
        type: string
        required: true
      task_definition:
        description: >-
          Path to a task-definition JSON file in the repo to render and deploy. Used as a fallback
          when task_definition_family is not set. Mutually exclusive with task_definition_family.
        type: string
        required: false
        default: ""
      task_definition_family:
        description: >-
          ECS task definition family. When set, the latest active revision of this family is fetched
          from the AWS API and rendered for deployment, instead of a task-definition file from the
          repo. Takes precedence over task_definition.
        type: string
        required: false
        default: ""
      container_name:
        description: Container name in the task definition to update with the new image.
        type: string
        required: true
    outputs:
      task-definition-arn:
        description: The ARN of the registered ECS task definition
        value: ${{ jobs.deploy.outputs.task-definition-arn }}
    secrets:
      aws_iam_role:
        description: AWS IAM Role to assume
        required: false
      slack_webhook:
        description: Slack incoming webhook URL
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ${{ inputs.runner }}
    env:
      SLACK_WEBHOOK: ${{ secrets.slack_webhook }}
    outputs:
      task-definition-arn: ${{ steps.deploy.outputs.task-definition-arn }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.aws_iam_role }}
          role-session-name: github-${{ github.repository_id }}-${{ github.actor_id }}
          aws-region: ${{ inputs.aws_region }}

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          # Family takes precedence: when set, the action pulls the latest active revision from AWS.
          # Otherwise fall back to the task-definition file from the repo.
          task-definition-family: ${{ inputs.task_definition_family }}
          task-definition: ${{ inputs.task_definition_family == '' && inputs.task_definition || '' }}
          container-name: ${{ inputs.container_name }}
          image: "${{ inputs.image }}"

      - name: Deploy to ECS
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ inputs.ecs_service }}
          cluster: ${{ inputs.ecs_cluster }}
          wait-for-service-stability: true

      - name: Send Slack notification
        if:  ${{ success() && env.SLACK_WEBHOOK != '' }}
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4
        with:
          webhook: ${{ secrets.slack_webhook }}
          webhook-type: incoming-webhook
          payload: |
            text: "✅ ECS deployment ${{ job.status }}: ${{ github.repository }}"
            attachments:
              - color: "${{ job.status == 'success' && '#2eb886' || (job.status == 'cancelled' && '#9ca3af' || '#e01e5a') }}"
                blocks:
                  - type: section
                    text:
                      type: mrkdwn
                      text: "*ECS deployment ${{ job.status }}*"
                  - type: section
                    fields:
                      - type: mrkdwn
                        text: "*Repository:*\n${{ github.repository }}"
                      - type: mrkdwn
                        text: "*Ref:*\n${{ github.ref_type }}: ${{ github.ref_name }}"
                      - type: mrkdwn
                        text: "*ECS service:*\n${{ inputs.ecs_service }}"
                      - type: mrkdwn
                        text: "*Task definition revision:*\n${{ steps.deploy.outputs.task-definition-arn }}"

      - name: Get rolled-back task definition
        id: get-rollback-task-def
        if: ${{ failure() && steps.deploy.outcome == 'failure' }}
        shell: bash
        run: |
          rollback_task_def=$(aws ecs describe-services \
            --cluster "${{ inputs.ecs_cluster }}" \
            --services "${{ inputs.ecs_service }}" \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "rollback_task_def=$rollback_task_def" >> "$GITHUB_OUTPUT"

      - name: Slack — failure
        if: ${{ failure() && env.SLACK_WEBHOOK != '' && steps.deploy.outcome == 'failure' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4
        with:
          webhook: ${{ secrets.slack_webhook }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ ECS deployment failed — rolled back to previous version"
            attachments:
                blocks:
                  - type: section
                    fields:
                      - type: mrkdwn
                        text: "*Repository:*\n${{ github.repository }}"
                      - type: mrkdwn
                        text: "*Cluster:*\n`${{ inputs.ecs_cluster }}`"
                      - type: mrkdwn
                        text: "*Service:*\n`${{ inputs.ecs_service }}`"
                      - type: mrkdwn
                        text: "*Rolled back to:*\n`${{ steps.get-rollback-task-def.outputs.rollback_task_def }}`"
                      - type: mrkdwn
                        text: "*Failed commit:*\n`${{ github.sha }}`"
                      - type: mrkdwn
                        text: "*Logs:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"

      - name: Slack — unknown failure
        if: ${{ failure() && env.SLACK_WEBHOOK != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4
        with:
          webhook: ${{ secrets.slack_webhook }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ ECS deployment failed — one of the CI steps failed"
            attachments:
                blocks:
                  - type: section
                    fields:
                      - type: mrkdwn
                        text: "*Repository:*\n${{ github.repository }}"
                      - type: mrkdwn
                        text: "*Cluster:*\n`${{ inputs.ecs_cluster }}`"
                      - type: mrkdwn
                        text: "*Service:*\n`${{ inputs.ecs_service }}`"
                      - type: mrkdwn
                        text: "*Unknown failure*\n"
                      - type: mrkdwn
                        text: "*Failed commit:*\n`${{ github.sha }}`"
                      - type: mrkdwn
                        text: "*Logs:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
