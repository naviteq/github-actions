---
name: AWS Nuke / Apply
# Apply-phase of the two-phase aws-nuke pattern; re-validates every claim the
# caller makes before running with --no-dry-run. See docs/aws-nuke.md.
on:
  workflow_call:
    inputs:
      aws_account_id:
        description: Declared AWS account ID. Verified via aws sts get-caller-identity before any destructive action.
        type: string
        required: true
      aws_region:
        description: AWS region used for STS / SNS calls.
        type: string
        required: false
        default: us-east-1
      nuke_config_path:
        description: Path to the consumer-side aws-nuke.yaml config file (relative to repository root).
        type: string
        required: true
      regions_allowlist:
        description: >-
          Explicit allowlist of regions (newline- or comma-separated). Re-validated against the
          regions: block of the config file at apply time.
        type: string
        required: true
      issue_number:
        description: Audit issue number created by aws-nuke-plan.yaml.
        type: number
        required: true
      plan_run_id:
        description: GitHub Actions run id of the plan workflow (extracted from the approval comment).
        type: string
        required: true
      plan_artifact_name:
        description: Name of the plan artifact uploaded by aws-nuke-plan.yaml.
        type: string
        required: true
      approval_comment_body:
        description: >-
          Raw body of the approval comment as forwarded from the caller workflow. Re-validated
          against the strict regex `^/approve\s+nuke-<plan_run_id>$` before any destructive
          action — fuzzy text such as "approved!" or "lgtm" must be rejected.
        type: string
        required: true
      approval_actor:
        description: GitHub login of the user who posted the approval comment. Verified against CODEOWNERS at apply time.
        type: string
        required: true
      audit_topic_arn:
        description: Optional SNS topic ARN. When set, a structured audit event is published on success or failure.
        type: string
        required: false
        default: ""
      paused:
        description: Top-level pause switch. When true, the workflow exits early without running aws-nuke.
        type: boolean
        required: false
        default: false
      runner:
        description: GitHub Actions runner to use. Supports a single label or a JSON array of labels.
        type: string
        required: false
        default: ubuntu-24.04
      aws_nuke_version:
        description: aws-nuke release version. Should match what the plan phase used.
        type: string
        required: false
        # renovate: datasource=github-releases depName=ekristen/aws-nuke
        default: 3.66.0
      artifact_retention_days:
        description: Apply-log artifact retention in days. Must be >= 90 for audit purposes.
        type: number
        required: false
        default: 90
    secrets:
      aws_iam_role:
        description: AWS IAM role ARN to assume via OIDC. Trust policy must restrict by repository, repository_owner, and ref.
        required: true

permissions: {}

jobs:
  apply:
    name: aws-nuke apply
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || (inputs.runner || 'ubuntu-24.04') }}
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
    timeout-minutes: 60
    steps:
      - name: Honor pause switch
        id: pause
        env:
          PAUSED_INPUT: ${{ inputs.paused }}
          NUKE_FREEZE: ${{ vars.NUKE_FREEZE }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Evaluate pause switch and freeze flag"
          if [[ "${PAUSED_INPUT}" == "true" || "${NUKE_FREEZE,,}" == "true" ]]; then
            gh issue comment "${ISSUE}" \
              --repo "${{ github.repository }}" \
              --body "Apply skipped: pause switch is active (paused=${PAUSED_INPUT}, NUKE_FREEZE=${NUKE_FREEZE})."
            echo "::notice::aws-nuke apply paused. Exiting." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "::endgroup::"

      - name: Ensure aws-nuke labels exist
        if: ${{ steps.pause.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT
          echo "::group::Ensure aws-nuke labels exist in consumer repo"
          # `gh issue edit --add-label` fails on a missing label, and the plan
          # phase may not have created it — deleted, or a hand-made issue.
          ensure_label() {
            local name="$1" color="$2" desc="$3"
            if gh label create "${name}" \
                --repo "${{ github.repository }}" \
                --color "${color}" \
                --description "${desc}" 2>/dev/null; then
              echo "Created label: ${name}"
              return 0
            fi
            if gh label list --repo "${{ github.repository }}" \
                --search "${name}" \
                --json name \
                --jq ".[] | select(.name == \"${name}\") | .name" \
                | grep -qx "${name}"; then
              echo "Label already present: ${name}"
            else
              echo "::error::Failed to ensure label '${name}' exists in ${{ github.repository }}." >&2
              return 1
            fi
          }
          ensure_label "nuke:pending"  "FBCA04" "aws-nuke: plan awaiting approval"
          ensure_label "nuke:applying" "0E8A16" "aws-nuke: apply in progress"
          ensure_label "nuke:failed"   "B60205" "aws-nuke: apply failed"

      - name: Production-account guard
        if: ${{ steps.pause.outputs.skip != 'true' }}
        env:
          AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
          PROD_ACCOUNTS: ${{ vars.RUNESTRA_PROD_ACCOUNTS }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT
          echo "::group::Check declared account against production-account allowlist"
          # Apply is the destructive half, so an advisory guard here is not a guard. "none" is
          # how an org with no production accounts declares that on purpose.
          declared="$(printf '%s' "${PROD_ACCOUNTS:-}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "${declared}" ]]; then
            gh issue comment "${ISSUE}" --repo "${{ github.repository }}" \
              --body "Apply refused: \`RUNESTRA_PROD_ACCOUNTS\` is unset, so the production-account guard cannot enforce. Set it to the production account IDs, or to the literal \`none\` if there are deliberately none, then re-approve."
            gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --add-label nuke:failed || true
            echo "::error::Refusing to apply: RUNESTRA_PROD_ACCOUNTS is unset and the production-account guard cannot enforce. Set it to the production account IDs, or to the literal 'none' if there are deliberately none." >&2
            exit 1
          fi
          if [[ "${declared}" == "none" ]]; then
            echo "::notice::RUNESTRA_PROD_ACCOUNTS is 'none': no production accounts are declared, so the guard has nothing to match."
            exit 0
          fi
          IFS=',' read -r -a accounts <<< "${PROD_ACCOUNTS}"
          for acct in "${accounts[@]}"; do
            trimmed="$(printf '%s' "$acct" | tr -d '[:space:]')"
            if [[ -n "$trimmed" && "$trimmed" == "${AWS_ACCOUNT_ID}" ]]; then
              gh issue comment "${ISSUE}" \
                --repo "${{ github.repository }}" \
                --body "Apply refused: account \`${AWS_ACCOUNT_ID}\` is listed in \`RUNESTRA_PROD_ACCOUNTS\`."
              gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --add-label nuke:failed || true
              echo "::error::Refusing to run aws-nuke against production account ${AWS_ACCOUNT_ID}" >&2
              exit 1
            fi
          done

      - name: Re-resolve auto-approve eligibility
        id: auto_approve
        if: ${{ steps.pause.outputs.skip != 'true' }}
        env:
          AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
          AUTO_APPROVE_ACCOUNTS: ${{ vars.NUKE_AUTO_APPROVE_ACCOUNTS }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT
          echo "::group::Detect auto-approve marker on audit issue and re-resolve org allowlist (defense in depth)"
          # Re-checking the org var here is what stops a hand-edited issue body
          # bypassing the human gate. See docs/aws-nuke.md.
          bypass="false"
          body="$(gh issue view "${ISSUE}" --repo "${{ github.repository }}" --json body --jq .body)"
          if ! grep -qF '<!-- nuke:auto-approve=true -->' <<< "${body}"; then
            echo "No auto-approve marker on issue ${ISSUE}; human-gate path will run."
          elif [[ -z "${AUTO_APPROVE_ACCOUNTS:-}" ]]; then
            gh issue comment "${ISSUE}" \
              --repo "${{ github.repository }}" \
              --body "Apply refused: issue carries the \`nuke:auto-approve=true\` marker but \`NUKE_AUTO_APPROVE_ACCOUNTS\` is unset at the org level."
            gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --add-label nuke:failed || true
            echo "::error::auto-approve marker present but NUKE_AUTO_APPROVE_ACCOUNTS is unset; refusing to bypass human gate." >&2
            exit 1
          else
            IFS=',' read -r -a allow <<< "${AUTO_APPROVE_ACCOUNTS}"
            match=0
            for acct in "${allow[@]}"; do
              trimmed="$(printf '%s' "$acct" | tr -d '[:space:]')"
              if [[ -n "$trimmed" && "$trimmed" == "${AWS_ACCOUNT_ID}" ]]; then
                match=1
                break
              fi
            done
            if (( match == 0 )); then
              gh issue comment "${ISSUE}" \
                --repo "${{ github.repository }}" \
                --body "Apply refused: issue carries the \`nuke:auto-approve=true\` marker but account \`${AWS_ACCOUNT_ID}\` is not on \`NUKE_AUTO_APPROVE_ACCOUNTS\`. The marker alone is not sufficient."
              gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --add-label nuke:failed || true
              echo "::error::auto-approve marker present but account ${AWS_ACCOUNT_ID} is not on NUKE_AUTO_APPROVE_ACCOUNTS." >&2
              exit 1
            fi
            bypass="true"
            echo "Auto-approve confirmed for account ${AWS_ACCOUNT_ID}; CODEOWNERS check will be skipped."
          fi
          echo "bypass_human_gate=${bypass}" >> "$GITHUB_OUTPUT"

      - name: Record auto-approve audit comment
        if: ${{ steps.pause.outputs.skip != 'true' && steps.auto_approve.outputs.bypass_human_gate == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
          AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          ACTOR: ${{ inputs.approval_actor }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT
          echo "::group::Comment auto-approve decision on audit issue"
          gh issue comment "${ISSUE}" \
            --repo "${{ github.repository }}" \
            --body "Apply auto-approved: account \`${AWS_ACCOUNT_ID}\` is on \`NUKE_AUTO_APPROVE_ACCOUNTS\` and issue carries the \`nuke:auto-approve=true\` marker. Approve comment posted by \`@${ACTOR}\` (plan-bot identity); CODEOWNERS check skipped. Plan run: ${PLAN_RUN_ID}."

      - name: Re-validate approval comment regex
        if: ${{ steps.pause.outputs.skip != 'true' }}
        env:
          COMMENT: ${{ inputs.approval_comment_body }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT
          echo "::group::Re-validate approval comment against strict regex"
          # Use grep -P -x with a fully anchored pattern. -x means the entire line must match;
          # this rejects trailing text like "/approve nuke-123 please".
          pattern='^/approve[[:space:]]+nuke-'"${PLAN_RUN_ID}"'$'
          if ! printf '%s' "${COMMENT}" | grep -qE -x "${pattern}"; then
            gh issue comment "${ISSUE}" \
              --repo "${{ github.repository }}" \
              --body "Apply refused: approval comment did not match the required format \`/approve nuke-${PLAN_RUN_ID}\`."
            gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --add-label nuke:failed || true
            echo "::error::Approval comment rejected by regex." >&2
            exit 1
          fi

      - name: Re-fetch CODEOWNERS and verify approver
        if: ${{ steps.pause.outputs.skip != 'true' && steps.auto_approve.outputs.bypass_human_gate != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ inputs.approval_actor }}
          ISSUE: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT

          echo "::group::Resolve default branch"
          default_branch="$(gh api "repos/${{ github.repository }}" --jq .default_branch)"
          if [[ -z "${default_branch}" ]]; then
            echo "::error::Could not resolve default branch." >&2
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Fetch CODEOWNERS from default branch"
          codeowners=""
          for path in .github/CODEOWNERS CODEOWNERS docs/CODEOWNERS; do
            # Not `gh api --jq`: some gh versions JSON-encode the extracted
            # string, which then breaks strict `base64 -d`. Pipe `jq -r`.
            response="$(gh api "repos/${{ github.repository }}/contents/${path}?ref=${default_branch}" 2>/dev/null || true)"
            if [[ -z "${response}" ]]; then
              continue
            fi
            # 404 / error bodies are JSON without a `.content` field — skip.
            content="$(printf '%s' "${response}" | jq -r '.content // empty' 2>/dev/null || true)"
            if [[ -z "${content}" ]]; then
              continue
            fi
            encoding="$(printf '%s' "${response}" | jq -r '.encoding // empty' 2>/dev/null || true)"
            if [[ "${encoding}" != "base64" ]]; then
              # >1 MB files come back with encoding="none" — the body needs
              # download_url, so fall through rather than decode non-base64.
              echo "::notice::Skipping ${path}@${default_branch}: unexpected encoding '${encoding}'."
              continue
            fi
            # GitHub wraps content at 60 chars with \n, sometimes \r\n — strip
            # every whitespace byte or strict `base64 -d` rejects the payload.
            cleaned="$(printf '%s' "${content}" | tr -d '[:space:]')"
            if ! decoded="$(printf '%s' "${cleaned}" | base64 -d 2>/dev/null)"; then
              # Hard fail, never fall through: a corrupted CODEOWNERS would
              # otherwise mask the intended approvers and apply against others.
              echo "::error::Failed to base64-decode CODEOWNERS body from ${path}@${default_branch} (cleaned length=${#cleaned})." >&2
              gh issue comment "${ISSUE}" \
                --repo "${{ github.repository }}" \
                --body "Apply refused: CODEOWNERS at \`${path}\` on \`${default_branch}\` failed base64 decode."
              gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --add-label nuke:failed || true
              exit 1
            fi
            codeowners="${decoded}"
            echo "Loaded CODEOWNERS from ${path}@${default_branch}"
            break
          done

          if [[ -z "${codeowners}" ]]; then
            gh issue comment "${ISSUE}" \
              --repo "${{ github.repository }}" \
              --body "Apply refused: no CODEOWNERS file found on default branch \`${default_branch}\`."
            gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --add-label nuke:failed || true
            echo "::error::No CODEOWNERS file on default branch." >&2
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Extract owner handles from CODEOWNERS"
          # Collect @handles from non-comment lines.
          owners="$(printf '%s\n' "${codeowners}" \
            | sed 's/#.*$//' \
            | grep -oE '@[A-Za-z0-9_./-]+' \
            | sed 's#^@##' \
            | sort -u || true)"

          if [[ -z "${owners}" ]]; then
            gh issue comment "${ISSUE}" \
              --repo "${{ github.repository }}" \
              --body "Apply refused: CODEOWNERS on \`${default_branch}\` lists no approvers."
            gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --add-label nuke:failed || true
            echo "::error::CODEOWNERS lists no approvers." >&2
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Verify approver against CODEOWNERS handles and team memberships"
          actor_lc="$(printf '%s' "${ACTOR}" | tr '[:upper:]' '[:lower:]')"
          match=0
          while IFS= read -r owner; do
            owner_lc="$(printf '%s' "${owner}" | tr '[:upper:]' '[:lower:]')"
            if [[ "${owner_lc}" == "${actor_lc}" ]]; then
              match=1; break
            fi
            # Team membership check (handles "org/team" entries).
            if [[ "${owner_lc}" == */* ]]; then
              org="${owner_lc%/*}"
              team="${owner_lc#*/}"
              if gh api "orgs/${org}/teams/${team}/memberships/${ACTOR}" --jq '.state' 2>/dev/null | grep -qx active; then
                match=1; break
              fi
            fi
          done <<< "${owners}"

          if (( match == 0 )); then
            gh issue comment "${ISSUE}" \
              --repo "${{ github.repository }}" \
              --body "Apply refused: \`@${ACTOR}\` is not listed in CODEOWNERS on \`${default_branch}\`."
            gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --add-label nuke:failed || true
            echo "::error::Approver ${ACTOR} not in CODEOWNERS." >&2
            exit 1
          fi
          echo "::endgroup::"

      - name: In-progress marker
        if: ${{ steps.pause.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT
          echo "::group::Mark audit issue as apply-in-progress"
          labels="$(gh issue view "${ISSUE}" --repo "${{ github.repository }}" --json labels --jq '[.labels[].name]')"
          if echo "${labels}" | grep -qE '"nuke:applying"'; then
            echo "::error::Issue ${ISSUE} already has nuke:applying label — refusing concurrent apply." >&2
            exit 1
          fi
          gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --add-label nuke:applying

      - name: Checkout consumer repository
        if: ${{ steps.pause.outputs.skip != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install AWS CLI v2
        if: ${{ steps.pause.outputs.skip != 'true' }}
        uses: naviteq/github-actions/.github/actions/setup-aws-cli@11d7bde538fd4ccf3dc13c2cf862945b7302d780

      - name: Configure AWS credentials (OIDC)
        if: ${{ steps.pause.outputs.skip != 'true' }}
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.aws_iam_role }}
          role-session-name: github-${{ github.repository_id }}-${{ github.actor_id }}-nuke-apply
          aws-region: ${{ inputs.aws_region }}

      - name: Verify caller identity matches declared account
        if: ${{ steps.pause.outputs.skip != 'true' }}
        env:
          DECLARED_ACCOUNT_ID: ${{ inputs.aws_account_id }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT
          echo "::group::Verify STS caller identity matches declared account"
          actual="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "${actual}" != "${DECLARED_ACCOUNT_ID}" ]]; then
            echo "::error::STS account mismatch. Declared=${DECLARED_ACCOUNT_ID} actual=${actual}. Refusing to run." >&2
            exit 1
          fi

      - name: Validate config regions against allowlist
        if: ${{ steps.pause.outputs.skip != 'true' }}
        env:
          NUKE_CONFIG: ${{ inputs.nuke_config_path }}
          REGIONS_ALLOWLIST: ${{ inputs.regions_allowlist }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT

          echo "::group::Verify nuke config file exists"
          if [[ ! -f "${NUKE_CONFIG}" ]]; then
            echo "::error::nuke_config_path '${NUKE_CONFIG}' not found in repository." >&2
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Parse allowlist and extract config regions"
          mapfile -t allow < <(printf '%s\n' "${REGIONS_ALLOWLIST}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | sort -u)
          mapfile -t config_regions < <(awk '
            /^regions:[[:space:]]*$/ { in_block=1; next }
            in_block && /^[a-zA-Z]/ { in_block=0 }
            in_block && /^[[:space:]]*-/ { sub(/^[[:space:]]*-[[:space:]]*/, ""); gsub(/["'\'']/, ""); print }
          ' "${NUKE_CONFIG}" | sort -u)
          echo "::endgroup::"

          echo "::group::Verify each config region is in allowlist"
          for r in "${config_regions[@]}"; do
            allowed=0
            for a in "${allow[@]}"; do
              if [[ "${r}" == "${a}" ]]; then allowed=1; break; fi
            done
            if (( allowed == 0 )); then
              echo "::error::Config region '${r}' is not in regions_allowlist." >&2
              exit 1
            fi
          done
          echo "::endgroup::"

      - name: Download plan artifact
        if: ${{ steps.pause.outputs.skip != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.plan_artifact_name }}
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}
          path: plan

      - name: Verify plan hash against audit issue
        if: ${{ steps.pause.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT

          echo "::group::Verify plan artifact contains resource-set.txt"
          if [[ ! -f plan/resource-set.txt ]]; then
            echo "::error::plan artifact missing resource-set.txt." >&2
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Recompute hash and extract issue marker"
          recomputed="$(sha256sum plan/resource-set.txt | awk '{print $1}')"
          embedded="$(gh issue view "${ISSUE}" --repo "${{ github.repository }}" --json body --jq .body \
            | grep -oE 'nuke:hash=[0-9a-f]{64}' \
            | head -n1 \
            | sed 's/^nuke:hash=//')"

          if [[ -z "${embedded}" ]]; then
            gh issue comment "${ISSUE}" \
              --repo "${{ github.repository }}" \
              --body "Apply refused: no hash marker found in issue body."
            gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --add-label nuke:failed --remove-label nuke:applying || true
            echo "::error::Hash marker not found in issue body." >&2
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Compare recomputed hash against issue-embedded hash"
          if [[ "${recomputed}" != "${embedded}" ]]; then
            gh issue comment "${ISSUE}" \
              --repo "${{ github.repository }}" \
              --body "Apply refused: plan artifact hash \`${recomputed}\` does not match issue-recorded hash \`${embedded}\`. Resource set drifted — re-plan before approving."
            gh issue edit "${ISSUE}" --repo "${{ github.repository }}" --add-label nuke:failed --remove-label nuke:applying || true
            echo "::error::Hash mismatch: recomputed=${recomputed} embedded=${embedded}" >&2
            exit 1
          fi

          echo "Hash verified: ${recomputed}"
          echo "::endgroup::"

      - name: Install aws-nuke
        if: ${{ steps.pause.outputs.skip != 'true' }}
        uses: naviteq/github-actions/.github/actions/aws-nuke-install@11d7bde538fd4ccf3dc13c2cf862945b7302d780
        with:
          version: ${{ inputs.aws_nuke_version }}

      - name: Run aws-nuke (destructive)
        id: nuke
        if: ${{ steps.pause.outputs.skip != 'true' }}
        # continue-on-error, the trailing `exit "${rc}"` and the failure-path
        # `exit 1` are one mechanism — see docs/aws-nuke.md before changing any.
        continue-on-error: true
        env:
          NUKE_CONFIG: ${{ inputs.nuke_config_path }}
        shell: bash
        run: |
          set -uo pipefail
          # `shell: bash` already runs with -e, which `set -uo pipefail` does not
          # clear; without this rc is never read. → see docs/aws-nuke.md
          set +e
          trap 'echo "::endgroup::"' EXIT

          echo "::group::Run aws-nuke with --no-dry-run (destructive)"
          # stdbuf line-buffers so a long destructive run does not look stuck in
          # the log; tee keeps the full apply log for the artifact upload.
          stdbuf -oL -eL aws-nuke run \
            --config "${NUKE_CONFIG}" \
            --no-dry-run \
            --no-prompt \
            --log-level info \
            --feature-flag filter-groups \
            2>&1 | tee nuke-apply.log
          rc=${PIPESTATUS[0]}
          echo "::endgroup::"

          echo "::group::Record aws-nuke exit code and failure reason"
          echo "nuke_exit_code=${rc}" >> "$GITHUB_OUTPUT"
          # aws-nuke prints why it stopped last, after its logrus output.
          # → see docs/aws-nuke.md
          reason=""
          if [[ "${rc}" -ne 0 ]]; then
            reason="$(grep -vE '^(time=|[[:space:]]*$)' nuke-apply.log | tail -n1 | tr -d '\r' | cut -c1-900)"
          fi
          echo "nuke_failure_reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"
          exit "${rc}"

      - name: Upload apply log
        if: ${{ steps.pause.outputs.skip != 'true' }}
        id: upload_log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aws-nuke-apply-${{ github.run_id }}
          path: nuke-apply.log
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: warn

      - name: Publish audit event
        if: ${{ steps.pause.outputs.skip != 'true' && inputs.audit_topic_arn != '' }}
        env:
          AUDIT_TOPIC_ARN: ${{ inputs.audit_topic_arn }}
          STATUS: ${{ steps.nuke.outcome }}
          AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
          REGIONS: ${{ inputs.regions_allowlist }}
          ACTOR: ${{ inputs.approval_actor }}
          RUN_ID: ${{ github.run_id }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          AUTO_APPROVED: ${{ steps.auto_approve.outputs.bypass_human_gate == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT

          echo "::group::Build SNS audit payload"
          payload="$(jq -n \
            --arg account "${AWS_ACCOUNT_ID}" \
            --arg regions "${REGIONS}" \
            --arg actor "${ACTOR}" \
            --arg status "${STATUS}" \
            --arg apply_run "${RUN_ID}" \
            --arg plan_run "${PLAN_RUN_ID}" \
            --arg repo "${{ github.repository }}" \
            --argjson auto_approved "${AUTO_APPROVED}" \
            '{
              event: "aws-nuke-apply",
              account: $account,
              regions: $regions,
              actor: $actor,
              status: $status,
              apply_run_id: $apply_run,
              plan_run_id: $plan_run,
              repository: $repo,
              auto_approved: $auto_approved
            }')"
          echo "::endgroup::"

          echo "::group::Publish audit event to SNS topic"
          aws sns publish \
            --topic-arn "${AUDIT_TOPIC_ARN}" \
            --message "${payload}" \
            --subject "aws-nuke-apply ${STATUS}" || echo "::warning::SNS publish failed; continuing."
          echo "::endgroup::"

      - name: Success path — close audit issue
        if: ${{ steps.pause.outputs.skip != 'true' && steps.nuke.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTO_APPROVED: ${{ steps.auto_approve.outputs.bypass_human_gate == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT

          echo "::group::Post success comment on audit issue"
          if [[ "${AUTO_APPROVED}" == "true" ]]; then
            provenance=" (auto-approved)"
          else
            provenance=""
          fi
          gh issue comment "${ISSUE}" \
            --repo "${{ github.repository }}" \
            --body "Apply succeeded${provenance}. Log artifact: \`aws-nuke-apply-${{ github.run_id }}\` (run: ${RUN_URL})."
          echo "::endgroup::"

          echo "::group::Remove pending labels and close audit issue"
          gh issue edit "${ISSUE}" --repo "${{ github.repository }}" \
            --remove-label nuke:pending \
            --remove-label nuke:applying || true
          gh issue close "${ISSUE}" --repo "${{ github.repository }}"
          echo "::endgroup::"

      - name: Failure path — leave issue open
        if: ${{ steps.pause.outputs.skip != 'true' && steps.nuke.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXIT_CODE: ${{ steps.nuke.outputs.nuke_exit_code }}
          REASON: ${{ steps.nuke.outputs.nuke_failure_reason }}
          AUTO_APPROVED: ${{ steps.auto_approve.outputs.bypass_human_gate == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::endgroup::"' EXIT

          echo "::group::Post failure comment on audit issue"
          if [[ "${AUTO_APPROVED}" == "true" ]]; then
            provenance=" (auto-approved)"
          else
            provenance=""
          fi
          body="Apply failed${provenance} (exit ${EXIT_CODE:-unknown})."
          if [[ -n "${REASON}" ]]; then
            body+=$'\n\n> '"${REASON}"
          fi
          body+=$'\n\n'"Log artifact: \`aws-nuke-apply-${{ github.run_id }}\` (run: ${RUN_URL}). Issue remains open."
          gh issue comment "${ISSUE}" --repo "${{ github.repository }}" --body "${body}"
          echo "::endgroup::"

          echo "::group::Update labels to nuke:failed"
          gh issue edit "${ISSUE}" --repo "${{ github.repository }}" \
            --add-label nuke:failed \
            --remove-label nuke:applying || true
          echo "::endgroup::"
          exit 1
