---
# On a push to the default branch: find the merged pull request's saved plans and open
# the issue that gates their apply; also warm the provider cache. → docs/terragrunt-apply.md
name: Terragrunt apply gate

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner to use. Supports a single label or a JSON array of labels.
        required: false
        type: string
        default: ubuntu-24.04
      working_directory:
        description: Directory the units live under, relative to the repository root; as in the plan
        required: false
        type: string
        default: "."
      second_approver_cost:
        description: The monthly cost delta above which the issue asks two approvers; empty reads vars.TERRAGRUNT_APPLY_SECOND_APPROVER_COST, and empty there never asks
        required: false
        type: string
        default: ""
      approvers:
        description: Comma-separated GitHub logins allowed to approve; empty reads vars.TERRAGRUNT_APPLY_APPROVERS
        required: false
        type: string
        default: ""
      label:
        description: Label prefix of the gate issues
        required: false
        type: string
        default: terragrunt-apply
      artifact_prefix:
        description: Prefix of the plan artifacts, as the plan names them before -pr<number>-<head sha>
        required: false
        type: string
        default: terragrunt-plan
      plan_workflow:
        description: File name of this repository's workflow that calls the plan on pull requests
        required: false
        type: string
        default: terragrunt-plan.yaml
      wait_minutes:
        description: How long to wait for the merged pull request's plan when it is still running
        required: false
        type: number
        default: 30
      engine:
        description: Engine that fetches providers into the cache, tofu or terraform
        required: false
        type: string
        default: tofu
      terragrunt_version:
        description: Terragrunt version; read from the repository's .terragrunt-version when empty
        required: false
        type: string
        default: ""
      opentofu_version:
        description: OpenTofu version; read from the repository's .opentofu-version when empty
        required: false
        type: string
        default: ""
      terraform_version:
        description: Terraform version for engine terraform; read from the repository's .terraform-version when empty
        required: false
        type: string
        default: ""
      config_file:
        description: The config file the apply reads, relative to the repository root; units its apply profiles skip get an apply-by-hand issue instead of an approval
        required: false
        type: string
        default: ""
      replan:
        description: When only the base moved between the plan and the merge, output the units to plan again instead of opening a blocking issue; chain terragrunt-replan on the replan output
        required: false
        type: boolean
        default: false
      provider_cache:
        description: Warm and save the provider cache the plan and apply restore
        required: false
        type: boolean
        default: true
      provider_mirror_url:
        description: Provider network mirror for the two public registries' providers, https://<host>/v1/mirror/ for boring-registry (http:// reaches Terragrunt's provider cache only); probed first, and downloads stay direct with a warning when it does not answer
        required: false
        type: string
        default: ""
      provider_mirror_ca_file:
        description: PEM file, relative to the repository root, with the CA behind an https provider_mirror_url whose certificate the runner does not trust, e.g. a private in-cluster CA
        required: false
        type: string
        default: ""
    secrets:
      runestra_client_id:
        description: Runestra registry client id, for providers from the private registry
        required: false
      runestra_client_secret:
        description: Runestra registry client secret
        required: false
      runestra_registry_token:
        description: Static Runestra registry token; preferred over the client id and secret, which cost an Auth0 token per job
        required: false
    outputs:
      state:
        description: nothing, no-changes, pending, by-hand, replan or blocked
        value: ${{ jobs.gate.outputs.state }}
      issue:
        description: The issue opened, if any
        value: ${{ jobs.gate.outputs.issue }}
      deleted:
        description: A filter per unit the merge deleted, one per line, for terragrunt-destroy; empty when none
        value: ${{ jobs.gate.outputs.deleted }}
      deleted_ref:
        description: The commit before the merge, where the deleted units still exist; terragrunt-destroy's ref
        value: ${{ jobs.gate.outputs.deleted_ref }}
      replan:
        description: With replan on, a filter per unit to plan again because the base moved, one per line, for terragrunt-replan; empty otherwise
        value: ${{ jobs.gate.outputs.replan }}
      replan_ref:
        description: The merged commit to plan those units at; terragrunt-replan's ref
        value: ${{ jobs.gate.outputs.replan_ref }}
      replan_pr:
        description: The pull request the re-plan belongs to; terragrunt-replan's pr
        value: ${{ jobs.gate.outputs.replan_pr }}

permissions: {}

jobs:
  gate:
    name: Gate the apply
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || (inputs.runner || 'ubuntu-24.04') }}
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      state: ${{ steps.decide.outputs.state }}
      issue: ${{ steps.decide.outputs.issue }}
      deleted: ${{ steps.decide.outputs.deleted }}
      deleted_ref: ${{ steps.decide.outputs.deleted_ref }}
      replan: ${{ steps.decide.outputs.replan }}
      replan_ref: ${{ steps.decide.outputs.replan_ref }}
      replan_pr: ${{ steps.decide.outputs.replan_pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Record the merged tree and whether it moved
        id: tree
        env:
          SCOPE: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          scope="${SCOPE#./}"
          scope="${scope%/}"
          if [ -z "${scope}" ] || [ "${scope}" = "." ]; then ref="HEAD^{tree}"; path="."; else ref="HEAD:${scope}"; path="${scope}"; fi
          changed=true
          if git rev-parse -q --verify HEAD^ > /dev/null && git diff --quiet HEAD^ HEAD -- "${path}"; then changed=false; fi
          {
            echo "tree=$(git rev-parse "${ref}")"
            echo "changed=${changed}"
            echo "base=$(git rev-parse -q --verify HEAD^ || true)"
          } >> "$GITHUB_OUTPUT"

      - name: Find the merged pull request and its plans
        id: find
        uses: naviteq/github-actions/.github/actions/terragrunt-apply-gate@a9660770cffca61763503f6171c085f07654d432
        with:
          command: find
          sha: ${{ github.sha }}
          prefix: ${{ inputs.artifact_prefix }}
          # A pull request merged before its plan finished is not a pull request without a plan.
          plan_workflow: ${{ inputs.plan_workflow }}
          wait_minutes: ${{ inputs.wait_minutes }}

      - name: Download the plans' metadata
        if: steps.find.outputs.artifact_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.find.outputs.artifact_id }}
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/terragrunt-plans

      # The apply-mode profiles: a unit they skip gets no approval command. → docs/terragrunt-apply.md#units-ci-does-not-apply
      - name: Read the apply profiles
        id: config
        if: steps.find.outputs.artifact_id != '' && inputs.config_file != ''
        uses: naviteq/github-actions/.github/actions/terragrunt-config@a9660770cffca61763503f6171c085f07654d432
        with:
          config_file: ${{ inputs.config_file }}
          mode: apply

      - name: List the planned units
        id: planned
        if: steps.config.outcome == 'success'
        env:
          METADATA: ${{ runner.temp }}/terragrunt-plans/metadata.json
        run: |
          set -euo pipefail
          {
            echo "units<<GATE_UNITS_EOF"
            jq -r '.units[] | select(.deleted | not) | .unit' "${METADATA}"
            echo "GATE_UNITS_EOF"
          } >> "$GITHUB_OUTPUT"

      # An unmatched unit fails the apply itself; the issue still opens.
      - name: Find the units CI does not apply
        id: apply-profiles
        if: steps.config.outcome == 'success'
        continue-on-error: true
        uses: naviteq/github-actions/.github/actions/terragrunt-plan-profiles@a9660770cffca61763503f6171c085f07654d432
        with:
          profiles: ${{ steps.config.outputs.profiles }}
          units: ${{ steps.planned.outputs.units }}

      - name: Open the approval issue, or say why there is none
        id: decide
        uses: naviteq/github-actions/.github/actions/terragrunt-apply-gate@a9660770cffca61763503f6171c085f07654d432
        with:
          command: decide
          sha: ${{ github.sha }}
          pr: ${{ steps.find.outputs.pr }}
          pr_url: ${{ steps.find.outputs.pr_url }}
          head_sha: ${{ steps.find.outputs.head_sha }}
          artifact_id: ${{ steps.find.outputs.artifact_id }}
          metadata: ${{ steps.find.outputs.artifact_id != '' && format('{0}/terragrunt-plans/metadata.json', runner.temp) || '' }}
          tree: ${{ steps.tree.outputs.tree }}
          changed: ${{ steps.tree.outputs.changed }}
          working_directory: ${{ inputs.working_directory }}
          approvers: ${{ inputs.approvers || vars.TERRAGRUNT_APPLY_APPROVERS }}
          second_approver_cost: ${{ inputs.second_approver_cost || vars.TERRAGRUNT_APPLY_SECOND_APPROVER_COST }}
          label: ${{ inputs.label }}
          plan_state: ${{ steps.find.outputs.plan_state }}
          base_commit: ${{ steps.tree.outputs.base }}
          replan: ${{ inputs.replan }}
          apply_skipped: ${{ steps.apply-profiles.outputs.skipped }}

  # The default branch is the only place a cache entry every pull request can read is saved.
  warm:
    name: Warm the provider cache
    if: inputs.provider_cache
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || (inputs.runner || 'ubuntu-24.04') }}
    permissions:
      contents: read
    env:
      HAS_REGISTRY_AUTH: ${{ secrets.runestra_registry_token != '' || secrets.runestra_client_id != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Terragrunt and the engine
        uses: naviteq/github-actions/.github/actions/setup-terragrunt@a9660770cffca61763503f6171c085f07654d432
        with:
          engine: ${{ inputs.engine }}
          terragrunt_version: ${{ inputs.terragrunt_version }}
          opentofu_version: ${{ inputs.opentofu_version }}
          terraform_version: ${{ inputs.terraform_version }}

      - name: Resolve the registry token
        if: env.HAS_REGISTRY_AUTH == 'true'
        uses: naviteq/github-actions/.github/actions/registry-token@a9660770cffca61763503f6171c085f07654d432
        with:
          token: ${{ secrets.runestra_registry_token }}
          client_id: ${{ secrets.runestra_client_id }}
          client_secret: ${{ secrets.runestra_client_secret }}

      # → docs/terragrunt-provider-mirror.md
      - name: Send provider downloads through the mirror
        if: inputs.provider_mirror_url != ''
        uses: naviteq/github-actions/.github/actions/terragrunt-provider-mirror@a9660770cffca61763503f6171c085f07654d432
        with:
          url: ${{ inputs.provider_mirror_url }}
          ca_file: ${{ inputs.provider_mirror_ca_file }}
          engine: ${{ inputs.engine }}

      - name: Restore the provider cache
        id: provider-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/terragrunt-providers
          key: terragrunt-providers-${{ runner.os }}-${{ runner.arch }}-${{ inputs.engine }}-${{ hashFiles(format('{0}/**/.terraform.lock.hcl', inputs.working_directory)) }}

      - name: Warm the provider cache from the lock files
        if: steps.provider-cache.outputs.cache-hit != 'true'
        uses: naviteq/github-actions/.github/actions/terragrunt-warm-providers@a9660770cffca61763503f6171c085f07654d432
        with:
          working_directory: ${{ inputs.working_directory }}
          engine: ${{ inputs.engine }}
          cache_dir: ${{ runner.temp }}/terragrunt-providers

      - name: Save the provider cache
        if: steps.provider-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/terragrunt-providers
          key: ${{ steps.provider-cache.outputs.cache-primary-key }}
